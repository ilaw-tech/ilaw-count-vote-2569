const INITIAL_STATE = {
  step: 1, province: '', district: '', unitType: '',
  amphoe: '', tambon: '', unit: '', place: '',
  sheetNo: '',  // ใบที่ N — for advance/overseas
  type: null, scores: {},
  override: false, other: false, overrideNote: '',  // override paths + optional note
  submitting: false, submitted: false, submissionId: '',
};

// ============================================================
// SHARED — flow hook + atoms (Dropdown, ScoreInput)
// ============================================================
function useElectionFlow(volunteer) {
  const [state, setState] = React.useState(INITIAL_STATE);
  const update = (patch) => setState((s) => ({ ...s, ...patch }));

  // Changing higher-level location invalidates lower-level + scores
  const setProvince = (p) => update({ province: p, district: '', unitType: '', amphoe: '', tambon: '', unit: '', place: '', sheetNo: '', type: null, scores: {}, override: false, other: false, overrideNote: '' });
  const setDistrict = (d) => update({ district: d, unitType: '', amphoe: '', tambon: '', unit: '', place: '', sheetNo: '', type: null, scores: {}, override: false, other: false, overrideNote: '' });
  const setUnitType = (t) => update({ unitType: t, amphoe: '', tambon: '', unit: '', place: '', sheetNo: '' });
  const setAmphoe = (a) => update({ amphoe: a, tambon: '', unit: '', place: '' });
  const setTambon = (t) => update({ tambon: t, unit: '', place: '' });
  const setUnit = (u, place) => update({ unit: u, place: place || '' });
  const setSheetNo = (n) => update({ sheetNo: n });
  const setType = (t) => update({ type: t });
  const setScore = (key, val) => setState((s) => ({ ...s, scores: { ...s.scores, [key]: val } }));
  const setOverride = (v) => update({ override: v });
  const setOther = (v) => update({ other: v });
  const setOverrideNote = (v) => update({ overrideNote: v });
  const goStep = (n) => update({ step: n });

  // Partial reset: keep province/district/unitType/amphoe/tambon, reset only scoped fields
  const reset = () => setState((s) => ({
    ...INITIAL_STATE,
    step: 1,
    province: s.province,
    district: s.district,
    unitType: s.unitType,
    amphoe: s.unitType === 'normal' ? s.amphoe : '',
    tambon: s.unitType === 'normal' ? s.tambon : '',
  }));

  const isSpecialUnit = state.unitType === 'advance-out' || state.unitType === 'advance-in' || state.unitType === 'overseas';
  const locationValid = state.province && state.district && (
    (state.unitType === 'normal' && state.amphoe && state.tambon && state.unit) ||
    (isSpecialUnit && state.sheetNo)
  );

  const districtKey = state.province && state.district ? `${state.province}|${state.district}` : null;
  const districtsForProvince = React.useMemo(() => {
    const prov = SAMPLE_DATA.provinces.find((p) => p.name === state.province);
    return prov ? prov.districts : [];
  }, [state.province]);
  const amphoesObj = districtKey ? (SAMPLE_DATA.amphoes[districtKey] || {}) : {};
  const tambonsObj = state.amphoe ? (amphoesObj[state.amphoe] || {}) : {};
  const unitsList = state.tambon ? (tambonsObj[state.tambon] || []) : [];
  const candidates = districtKey ? (SAMPLE_DATA.candidates[districtKey] || []) : [];
  const parties = SAMPLE_DATA.parties;

  const submit = async () => {
    if (!volunteer) return;
    update({ submitting: true });
    const seq = nextSeq();
    const submissionId = formatSubmissionId(volunteer.code, state, seq);
    const payload = collectData(state, volunteer, submissionId);
    try {
      const r = await submitWithRetry(payload);
      update({ submitting: false, submitted: true, submissionId: r.submission_id || submissionId });
    } catch (e) {
      // backup: queue locally + show locally-computed ID (it's predictable)
      const queue = getPending();
      queue.push({ payload, submission_id: submissionId, savedAt: Date.now(), error: String(e?.message || e) });
      setPendingQueue(queue);
      update({ submitting: false, submitted: true, submissionId });
    }
  };

  const fullReset = () => setState(INITIAL_STATE);

  return {
    state, update, setProvince, setDistrict, setUnitType,
    setAmphoe, setTambon, setUnit, setSheetNo, setType, setScore,
    setOverride, setOther, setOverrideNote,
    goStep, reset, fullReset, submit,
    locationValid, districtKey, districtsForProvince,
    amphoesObj, tambonsObj, unitsList, candidates, parties,
    isSpecialUnit,
  };
}

function computeTotals(flow) {
  const { state, candidates, parties } = flow;
  const list = state.type === 'zone' ? candidates : parties;
  let sumScores = 0;
  const rows = list.map((item) => {
    const k = state.type === 'zone' ? `score-${item.no}` : `party-${item.no}`;
    const v = parseInt(state.scores[k] || 0) || 0;
    sumScores += v;
    return { ...item, value: v, key: k };
  });
  const usedKey  = `used-${state.type}`;
  const validKey = `valid-${state.type}`;
  const invKey   = `invalid-${state.type}`;
  const novKey   = `noVote-${state.type}`;
  const used  = parseInt(state.scores[usedKey]  || 0) || 0;
  const valid = parseInt(state.scores[validKey] || 0) || 0;
  const inv   = parseInt(state.scores[invKey]   || 0) || 0;
  const novote = parseInt(state.scores[novKey]  || 0) || 0;
  return {
    rows, sumScores,
    used, valid, invalid: inv, noVote: novote,
    grand: valid + inv + novote,
    keys: { usedKey, validKey, invKey, novKey },
  };
}

const fmt = (n) => (n || 0).toLocaleString('th-TH');

function Dropdown({ value, onChange, options, placeholder, disabled, accent = '#0071e3', dark }) {
  const [open, setOpen] = React.useState(false);
  const [activeIndex, setActiveIndex] = React.useState(-1);
  const ref = React.useRef(null);
  const listRef = React.useRef(null);
  const buttonRef = React.useRef(null);
  React.useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  // When opening, set activeIndex to the currently selected option (or 0)
  React.useEffect(() => {
    if (open) {
      const selIdx = options.findIndex((o) => o.value === value);
      setActiveIndex(selIdx >= 0 ? selIdx : 0);
    }
  }, [open]);
  // Scroll active option into view
  React.useEffect(() => {
    if (open && activeIndex >= 0 && listRef.current) {
      const el = listRef.current.children[activeIndex];
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }
  }, [activeIndex, open]);
  const selected = options.find((o) => o.value === value);
  const bg = dark ? '#1c1c1e' : '#fff';
  const border = dark ? '#2c2c2e' : '#d2d2d7';
  const fg = dark ? '#f5f5f7' : '#1d1d1f';
  const muted = '#86868b';
  const hover = dark ? '#2c2c2e' : '#f5f5f7';

  const handleKeyDown = (e) => {
    if (disabled) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!open) { setOpen(true); return; }
      setActiveIndex((i) => Math.min(options.length - 1, i + 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open) { setOpen(true); return; }
      setActiveIndex((i) => Math.max(0, i - 1));
    } else if (e.key === 'Enter' || (e.key === ' ' && open)) {
      e.preventDefault();
      e.stopPropagation();
      if (!open) { setOpen(true); return; }
      if (activeIndex >= 0 && options[activeIndex]) {
        onChange(options[activeIndex].value);
        setOpen(false);
        if (buttonRef.current) buttonRef.current.focus();
      }
    } else if (e.key === 'Escape' && open) {
      e.preventDefault();
      e.stopPropagation();
      setOpen(false);
      if (buttonRef.current) buttonRef.current.focus();
    } else if (e.key === 'Home' && open) {
      e.preventDefault();
      setActiveIndex(0);
    } else if (e.key === 'End' && open) {
      e.preventDefault();
      setActiveIndex(options.length - 1);
    }
  };

  return (
    <div ref={ref} style={{ position: 'relative', width: '100%' }} onKeyDown={handleKeyDown}>
      <button ref={buttonRef} type="button" disabled={disabled} onClick={() => !disabled && setOpen((o) => !o)}
        style={{
          width: '100%', background: bg,
          border: `1px solid ${open ? accent : border}`,
          borderRadius: 12, padding: '14px 16px', fontSize: 16,
          fontFamily: 'inherit', color: selected ? fg : muted,
          textAlign: 'left', cursor: disabled ? 'not-allowed' : 'pointer',
          opacity: disabled ? 0.4 : 1,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
          transition: 'border-color 0.15s, box-shadow 0.15s',
          boxShadow: open ? `0 0 0 4px ${accent}1a` : 'none',
        }}>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {selected ? selected.label : placeholder}
        </span>
        <span style={{ color: muted, transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }}>
          <Icon.ChevronDown />
        </span>
      </button>
      {open && (
        <div ref={listRef} style={{
          position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0,
          background: bg, border: `1px solid ${border}`, borderRadius: 12,
          boxShadow: dark ? '0 12px 32px rgba(0,0,0,0.5)' : '0 12px 32px rgba(0,0,0,0.12)',
          maxHeight: 280, overflowY: 'auto', zIndex: 50, padding: 6,
        }}>
          {options.length === 0 && (
            <div style={{ padding: 12, color: muted, fontSize: 14 }}>ไม่มีตัวเลือก</div>
          )}
          {options.map((o, idx) => {
            const isSelected = o.value === value;
            const isActive = idx === activeIndex;
            return (
              <div key={o.value}
                onClick={() => { onChange(o.value); setOpen(false); if (buttonRef.current) buttonRef.current.focus(); }}
                onMouseEnter={() => setActiveIndex(idx)}
                style={{
                  padding: '10px 12px', fontSize: 15, color: fg,
                  borderRadius: 8, cursor: 'pointer',
                  background: isActive ? hover : (isSelected ? `${accent}15` : 'transparent'),
                  fontWeight: isSelected ? 600 : 400,
                }}>
                {o.label}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ScoreInput({ value, onChange, dark, accent, autoFocus, onLastEnter }) {
  const [focused, setFocused] = React.useState(false);
  const bg = dark ? '#1c1c1e' : '#fff';
  const border = dark ? '#2c2c2e' : '#d2d2d7';
  const fg = dark ? '#f5f5f7' : '#1d1d1f';
  // Use type=text + inputMode=numeric instead of type=number to avoid:
  //   (a) desktop mouse-wheel changing value when input is focused
  //   (b) browser auto-validation returning empty e.target.value mid-typing
  //   (c) up/down arrow keys stepping the value unintentionally
  const handleKeyDown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      const all = Array.from(document.querySelectorAll('input[data-score-input="1"]'));
      const idx = all.indexOf(e.target);
      const next = all[idx + 1];
      if (next) next.focus();
      else if (onLastEnter) onLastEnter();
    }
  };
  return (
    <input type="text" inputMode="numeric" pattern="[0-9]*" placeholder="0"
      data-score-input="1"
      value={value == null ? '' : String(value)}
      autoFocus={autoFocus}
      onChange={(e) => {
        // Strip everything that isn't a digit (handles paste, IME, Thai numerals via copy, etc.)
        const cleaned = e.target.value.replace(/[^0-9]/g, '');
        onChange(cleaned);
      }}
      onKeyDown={handleKeyDown}
      onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
      style={{
        width: 92, background: bg, color: fg,
        border: `1px solid ${focused ? accent : border}`,
        borderRadius: 10, padding: '10px 12px',
        fontSize: 16, fontFamily: 'inherit', fontWeight: 500,
        textAlign: 'right', outline: 'none',
        transition: 'border-color 0.15s, box-shadow 0.15s',
        boxShadow: focused ? `0 0 0 4px ${accent}1a` : 'none',
      }}/>
  );
}

          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 600 }}>iLaw Vote 2569</div>

          </div>
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
          {!state.submitted && (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 6,
              background: T.surface, padding: '6px 10px',
              borderRadius: 100, fontSize: 11, color: T.label, fontWeight: 500,

        </div>
      </header>

          color: dark ? '#93c5fd' : '#1e40af',

          cursor: flushing ? 'wait' : 'pointer', fontWeight: 500, flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        }}>
          {flushing ? (
            <><Icon.Spinner size={13} stroke={2}/> กำลังส่ง {pendingCount} หน่วย…</>
          ) : (
            <>📦 มี {pendingCount} หน่วยรอส่ง — กดเพื่อลองใหม่</>
          )}

      <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', padding: '8px 16px 32px' }}>
        <div style={{ maxWidth: 600, margin: '0 auto' }}>

          {state.step === 2 && <CardType flow={flow} T={T} accent={accent}/>}
          {state.step === 3 && <CardScores flow={flow} T={T} accent={themeAccent} dark={dark}/>}
          {state.step === 4 && <CardConfirm flow={flow} T={T} accent={themeAccent} dark={dark}/>}

            }}>
              <div style={{
                width: 30, height: 30, borderRadius: 8,
                background: `${accent}15`, color: accent,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 13, fontWeight: 700,
              }}>{item.no}</div>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 500, color: T.fg, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.name}</div>
                {item.party && <div style={{ fontSize: 12, color: T.muted, marginTop: 1 }}>{item.party}</div>}
              </div>
              <ScoreInput value={state.scores[k]} onChange={(v) => setScore(k, v)} dark={dark} accent={accent}
                onLastEnter={onLastEnter}/>
            </div>
          );
        })}
      </div>
    </>
  );
}

function CardScores({ flow, T, accent, dark }) {
  const { state, candidates, parties, goStep } = flow;
  const totals = computeTotals(flow);
  const validation = buildValidation(state, totals);
  const advanceToConfirm = () => goStep(4);
  return (
    <div>
      <HeroCard T={T} accent={accent} eyebrow="ขั้นที่ 3 จาก 4" title="กรอกคะแนน"
        sub={state.type === 'zone' ? 'คะแนน ส.ส. แบบแบ่งเขต' : `คะแนนบัญชีรายชื่อ · ${parties.length} พรรค`}/>
      <ChipsCard flow={flow} T={T}/>

      <LiveValidationStatus T={T} totals={totals} validation={validation} dark={dark}/>

      <MobileScoreForm flow={flow} T={T} accent={accent} dark={dark}
        autoFocusFirst onLastEnter={advanceToConfirm}/>

      <ButtonRow>
        <GhostButton T={T} onClick={() => goStep(2)}>ย้อนกลับ</GhostButton>
        <PillButton accent={accent} onClick={() => goStep(4)} style={{ flex: 1 }}>
          ตรวจสอบก่อนส่ง
        </PillButton>
      </ButtonRow>
    </div>
  );
}

function SpecialMobileRow({ T, dark, accent, color, label, value, onChange, border, autoFocus, onLastEnter }) {
  return (
    <div style={{
      padding: '12px 18px',
      borderTop: border ? `0.5px solid ${T.border}` : 'none',
      display: 'grid', gridTemplateColumns: 'auto 1fr auto', gap: 12, alignItems: 'center',
    }}>
      <div style={{ width: 10, height: 10, borderRadius: '50%', background: color }}/>
      <div style={{ fontSize: 14, fontWeight: 500, color: T.fg }}>{label}</div>
      <ScoreInput value={value} onChange={onChange} dark={dark} accent={accent}
        autoFocus={autoFocus} onLastEnter={onLastEnter}/>
    </div>
  );
}

function CardConfirm({ flow, T, accent, dark }) {
  const { state, goStep, submit, setOverride, setOther, setOverrideNote } = flow;
  const totals = computeTotals(flow);
  const validation = buildValidation(state, totals);
  const { hasBlocking } = validation;
  const canSubmit = !hasBlocking || state.override || (state.other && state.overrideNote.trim().length > 0);
  return (
    <div onKeyDown={(e) => { if (e.key === 'Enter' && canSubmit && !state.submitting && e.target?.tagName !== 'TEXTAREA') submit(); }}>
      <HeroCard T={T} accent={accent} eyebrow="ขั้นที่ 4 จาก 4" title="ยืนยันก่อนส่ง"
        sub="ตรวจสอบความถูกต้อง เมื่อส่งแล้วจะแก้ไขไม่ได้อีก"/>
      <ChipsCard flow={flow} T={T}/>
      <ValidationAlert T={T} validation={validation} dark={dark}/>
      {hasBlocking ? (
        <>
          <div style={{ marginBottom: 14 }}>
            <OverrideBox T={T} state={state} setOverride={setOverride} setOther={setOther}
              setOverrideNote={setOverrideNote} dark={dark}/>
          </div>
          <div style={{
            padding: '10px 14px', borderRadius: 10, fontSize: 12,
            background: dark ? '#1e2a3a' : '#eff6ff',
            color: dark ? '#93c5fd' : '#1e40af',
            marginBottom: 12, lineHeight: 1.5,
          }}>
            ✏️ หรือแก้ค่าด้านล่างเพื่อให้ผลรวมตรงกัน — alert จะหายเอง
          </div>
          <MobileScoreForm flow={flow} T={T} accent={accent} dark={dark}/>
        </>
      ) : (
        <div style={{ background: T.surface, borderRadius: 22, marginBottom: 14, overflow: 'hidden' }}>
          <div style={{ padding: '18px 20px 12px' }}>
            <div style={{ fontSize: 12, color: T.muted, textTransform: 'uppercase', fontWeight: 600, letterSpacing: 0.6 }}>สรุป</div>
            <div style={{ fontSize: 14, color: T.fg, marginTop: 4 }}>
              {state.type === 'zone' ? 'ส.ส. แบบแบ่งเขต' : 'บัญชีรายชื่อ'} · {totals.rows.length} รายการ
            </div>
          </div>
          <div style={{ padding: '0 20px' }}>
            <div style={{ padding: '8px 0', display: 'flex', justifyContent: 'space-between', fontSize: 14, borderTop: `0.5px solid ${T.border}` }}>
              <span style={{ color: T.muted }}>บัตรที่ใช้</span>
              <span style={{ color: T.fg, fontWeight: 600 }}>{fmt(totals.used)}</span>
            </div>
            <div style={{ padding: '8px 0', display: 'flex', justifyContent: 'space-between', fontSize: 14, borderTop: `0.5px solid ${T.border}` }}>
              <span style={{ color: '#22c55e' }}>บัตรดี</span>
              <span style={{ color: T.fg, fontWeight: 600 }}>{fmt(totals.valid)}</span>
            </div>
            <div style={{ padding: '8px 0', display: 'flex', justifyContent: 'space-between', fontSize: 14, borderTop: `0.5px solid ${T.border}` }}>
              <span style={{ color: '#f59e0b' }}>บัตรเสีย</span>
              <span style={{ color: T.fg, fontWeight: 600 }}>{fmt(totals.invalid)}</span>
            </div>
            <div style={{ padding: '8px 0', display: 'flex', justifyContent: 'space-between', fontSize: 14, borderTop: `0.5px solid ${T.border}` }}>
              <span style={{ color: '#ef4444' }}>บัตรไม่เลือกผู้สมัครใด</span>
              <span style={{ color: T.fg, fontWeight: 600 }}>{fmt(totals.noVote)}</span>
            </div>
          </div>
          <div style={{ maxHeight: 220, overflowY: 'auto', padding: '0 20px', borderTop: `0.5px solid ${T.border}`, marginTop: 6 }}>
            {totals.rows.map((r) => (
              <div key={r.key} style={{
                padding: '8px 0', display: 'flex', justifyContent: 'space-between', gap: 12,
                fontSize: 14, borderTop: `0.5px solid ${T.border}`,
              }}>
                <span style={{ color: T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.no}. {r.name}</span>
                <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(r.value)}</span>
              </div>
            ))}
          </div>
          <div style={{
            marginTop: 12, padding: '18px 20px', background: `${accent}10`,
            display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
          }}>
            <span style={{ fontSize: 14, color: T.fg, fontWeight: 600 }}>คะแนนผู้สมัครรวม</span>
            <span style={{ fontSize: 28, color: accent, fontWeight: 700, letterSpacing: '-0.02em', fontVariantNumeric: 'tabular-nums' }}>
              {fmt(totals.sumScores)}
            </span>
          </div>
        </div>
      )}
      <ButtonRow>
        <GhostButton T={T} onClick={() => goStep(3)}>กลับแก้ไข</GhostButton>
        <PillButton accent={accent} onClick={submit} disabled={state.submitting || !canSubmit} style={{ flex: 1 }}>
          {state.submitting ? <><Icon.Spinner size={15}/> &nbsp;กำลังส่ง…</> : <><Icon.Send size={15}/> &nbsp;ส่งคะแนน</>}
        </PillButton>
      </ButtonRow>
    </div>
  );
}

function CardSuccess({ flow, T, accent }) {
  const { reset, state } = flow;
  return (
    <div style={{
      background: T.surface, borderRadius: 22, padding: '40px 24px',
      textAlign: 'center', marginTop: 20,
      animation: 'cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2)',
    }}>
      <div style={{
        width: 76, height: 76, borderRadius: '50%',
        background: `${accent}15`, color: accent,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        margin: '0 auto 20px',
        animation: 'checkPop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4) 0.1s both',
      }}>
        <Icon.Check size={38} stroke={2.5}/>
      </div>
      <h2 style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em', marginBottom: 8 }}>ส่งคะแนนสำเร็จ</h2>
      <p style={{ fontSize: 15, color: T.muted, marginBottom: 16 }}>ข้อมูลถูกบันทึกเรียบร้อยแล้ว</p>
      <div style={{
        display: 'inline-block', padding: '6px 14px', borderRadius: 8,
        background: T.bg, color: accent, fontFamily: 'ui-monospace, monospace', fontSize: 12,
        maxWidth: '100%', wordBreak: 'break-all',
      }}>ID · {state.submissionId}</div>
      <div style={{ marginTop: 28 }}>
        <PillButton accent={accent} onClick={reset}>
          <Icon.Plus size={16}/> &nbsp;บันทึกหน่วยถัดไป
        </PillButton>
      </div>
    </div>
  );
}

function PillButton({ children, accent, disabled, onClick, style }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      width: '100%', padding: '15px 20px',
      background: disabled ? '#c7c7cc' : accent, color: '#fff',
      border: 'none', borderRadius: 16,
      fontSize: 16, fontWeight: 600, fontFamily: 'inherit',
      cursor: disabled ? 'not-allowed' : 'pointer',
      transition: 'transform 0.1s',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4,
      opacity: disabled ? 0.5 : 1,
      ...style,
    }} onMouseDown={(e) => { if (!disabled) e.currentTarget.style.transform = 'scale(0.98)'; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = 'none'; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = 'none'; }}>
      {children}
    </button>
  );
}

function GhostButton({ children, onClick, T }) {
  return (
    <button onClick={onClick} style={{
      padding: '15px 22px', background: T.surface, color: T.fg,
      border: 'none', borderRadius: 16, fontSize: 15, fontWeight: 600,
      fontFamily: 'inherit', cursor: 'pointer',
    }}>{children}</button>
  );
}

function ButtonRow({ children }) {
  return <div style={{ display: 'flex', gap: 10 }}>{children}</div>;
}

function ChipsCard({ flow, T }) {
  const { state } = flow;
  const chips = [
    state.province,
    state.district && `เขต ${state.district}`,
    state.unitType === 'normal' && state.amphoe,
    state.unitType === 'normal' && state.tambon,
    state.unitType === 'normal' && state.unit && `หน่วย ${state.unit}`,
    state.unitType === 'advance-in'  && 'ล่วงหน้าในเขต',
    (state.unitType === 'advance-out' || state.unitType === 'overseas') && 'ล่วงหน้านอกเขต/นอกราชฯ',
    state.unitType !== 'normal' && state.unitType !== '' && state.sheetNo && `ใบที่ ${state.sheetNo}`,
  ].filter(Boolean);
  if (chips.length === 0) return null;
  return (
    <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 14 }}>
      {chips.map((c, i) => (
        <span key={i} style={{
          padding: '5px 11px', background: T.surface,
          borderRadius: 100, fontSize: 12, color: T.label, fontWeight: 500,
        }}>{c}</span>
      ))}
    </div>
  );
}

// ============================================================
// DESKTOP / TABLET — Landscape, no sidebar, no edit-after-submit
// Self-adapts to split-screen via ResizeObserver
// ============================================================
function VariantDesktop({ flow, theme, setTheme, accent, pendingCount, onResendPending, flushing, volunteer, onChangeUser }) {
  const { state } = flow;
  const dark = theme === 'dark';
  const themeAccent = state.type === 'party' ? accent.party : accent.zone;

  const containerRef = React.useRef(null);
  const [narrow, setNarrow] = React.useState(false);
  React.useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver((entries) => {
      for (const e of entries) setNarrow(e.contentRect.width < 820);
    });
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  const T = dark ? {
    bg: '#0a0a0a', surface: '#16161a', card: '#1c1c20',
    border: '#27272a', borderStrong: '#3f3f46',
    fg: '#fafafa', muted: '#a1a1aa', subtle: '#71717a', inputBg: '#1c1c20',
  } : {
    bg: '#f5f5f7', surface: '#fff', card: '#fff',
    border: '#e4e4e7', borderStrong: '#d4d4d8',
    fg: '#18181b', muted: '#52525b', subtle: '#a1a1aa', inputBg: '#fff',
  };

  if (state.submitted) {
    return <div ref={containerRef} style={{ width: '100%', height: '100%' }}>
      <DSuccess flow={flow} T={T} accent={themeAccent} narrow={narrow}/>
    </div>;
  }

  return (
    <div ref={containerRef} style={{
      width: '100%', height: '100%',
      background: T.bg, color: T.fg,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      <DTopbar T={T} accent={themeAccent} flow={flow} narrow={narrow} theme={theme} setTheme={setTheme}
        volunteer={volunteer} onChangeUser={onChangeUser}/>
      {pendingCount > 0 && (
        <div onClick={() => !flushing && onResendPending()} style={{
          background: dark ? '#1e3a8a' : '#dbeafe',
          color: dark ? '#93c5fd' : '#1e40af',
          padding: '8px 16px', textAlign: 'center', fontSize: 13,
          cursor: flushing ? 'wait' : 'pointer', fontWeight: 500, flexShrink: 0,
          borderBottom: `1px solid ${T.border}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        }}>
          {flushing ? (
            <><Icon.Spinner size={13} stroke={2}/> กำลังส่ง {pendingCount} หน่วย…</>
          ) : (
            <>📦 มี {pendingCount} หน่วยรอส่ง — กดเพื่อลองใหม่</>
          )}
        </div>
      )}
      <div style={{ flex: 1, minHeight: 0, overflow: 'hidden' }}>
        {state.step === 1 && <DLocation flow={flow} T={T} accent={accent} narrow={narrow} dark={dark}/>}
        {state.step === 2 && <DType flow={flow} T={T} accent={accent} narrow={narrow}/>}
        {state.step === 3 && <DScores flow={flow} T={T} accent={themeAccent} dark={dark} narrow={narrow}/>}
        {state.step === 4 && <DConfirm flow={flow} T={T} accent={themeAccent} narrow={narrow}/>}
      </div>
    </div>
  );
}

function DTopbar({ T, accent, flow, narrow, theme, setTheme, volunteer, onChangeUser }) {
  const { state } = flow;
  const stepLabels = ['เลือกหน่วย', 'ประเภทคะแนน', 'กรอกคะแนน', 'ยืนยันและส่ง'];
  return (
    <header style={{
      flexShrink: 0,
      borderBottom: `1px solid ${T.border}`,
      background: T.surface,
      padding: narrow ? '12px 16px' : '14px 24px',
      display: 'flex', alignItems: 'center', gap: narrow ? 10 : 16,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
        <div style={{
          width: 32, height: 32, borderRadius: 8,
          background: accent, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}><Icon.Ballot size={18} stroke={2}/></div>
        {!narrow && (
          <div>
            <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: '-0.01em' }}>iLaw Vote</div>
            <div style={{ fontSize: 11, color: T.muted }}>เลือกตั้ง 2569</div>
          </div>
        )}
      </div>
      <div style={{ flex: 1, display: 'flex', justifyContent: narrow ? 'flex-start' : 'center', minWidth: 0 }}>
        {narrow ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
            <div style={{
              width: 24, height: 24, borderRadius: '50%',
              background: accent, color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontSize: 12, fontWeight: 700, flexShrink: 0,
            }}>{state.step}</div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: T.fg, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {stepLabels[state.step - 1]}
              </div>
              <div style={{ fontSize: 10, color: T.muted, marginTop: 1 }}>ขั้นที่ {state.step} จาก {stepLabels.length}</div>
            </div>
          </div>
        ) : (
          <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
            {stepLabels.map((label, i) => {
              const n = i + 1;
              const active = state.step === n;
              const done = state.step > n;
              return (
                <React.Fragment key={n}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 8px' }}>
                    <div style={{
                      width: 22, height: 22, borderRadius: '50%',
                      background: done || active ? accent : T.border,
                      color: done || active ? '#fff' : T.muted,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontSize: 11, fontWeight: 700,
                      boxShadow: active ? `0 0 0 4px ${accent}25` : 'none',
                      transition: 'all 0.2s', flexShrink: 0,
                    }}>
                      {done ? <Icon.Check size={11} stroke={3}/> : n}
                    </div>
                    <span style={{
                      fontSize: 13, fontWeight: active ? 600 : 500,
                      color: active ? T.fg : done ? T.muted : T.subtle,
                      whiteSpace: 'nowrap',
                    }}>{label}</span>
                  </div>
                  {n < stepLabels.length && (
                    <div style={{ width: 18, height: 1, background: done ? accent : T.border, transition: 'background 0.2s', flexShrink: 0 }}/>
                  )}
                </React.Fragment>
              );
            })}
          </div>
        )}
      </div>
      {!narrow && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: T.muted, flexShrink: 0, minWidth: 0, maxWidth: 240 }}>
          {state.province && (
            <>
              <Icon.Pin size={13}/>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {state.province}{state.district ? ` · เขต ${state.district}` : ''}{state.unit ? ` · หน่วย ${state.unit}` : ''}
              </span>
            </>
          )}
        </div>
      )}
      {volunteer && <VolunteerBadge volunteer={volunteer} onChangeUser={onChangeUser} T={T} narrow={narrow}/>}
      <ThemeToggle theme={theme} setTheme={setTheme} T={T}/>
    </header>
  );
}

function DLocation({ flow, T, accent, narrow, dark }) {
  const { state, setProvince, setDistrict, setUnitType, setAmphoe, setTambon, setUnit, setSheetNo,
    locationValid, districtsForProvince, amphoesObj, tambonsObj, unitsList, isSpecialUnit, goStep } = flow;
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}
         onKeyDown={(e) => { if (e.key === 'Enter' && locationValid) goStep(2); }}>
      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: narrow ? '24px 16px' : '36px 32px' }}>
        <div style={{ maxWidth: 760, margin: '0 auto' }}>
          <div style={{ marginBottom: 24 }}>
            <h1 style={{ fontSize: narrow ? 24 : 28, fontWeight: 600, letterSpacing: '-0.02em', marginBottom: 6 }}>เลือกหน่วยเลือกตั้ง</h1>
            <p style={{ fontSize: 14, color: T.muted }}>ระบุตำแหน่งที่คุณดูแล ตัวเลือกจะปรับตามจังหวัดและเขต</p>
          </div>
          <div style={{
            background: T.surface, border: `1px solid ${T.border}`,
            borderRadius: 16, padding: narrow ? 18 : 28,
            display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 1fr', gap: 18,
          }}>
            <DField label="จังหวัด" T={T}>
              <Dropdown value={state.province} onChange={setProvince}
                options={SAMPLE_DATA.provinces.map((p) => ({ value: p.name, label: p.name }))}
                placeholder="เลือกจังหวัด" accent={accent.zone} dark={dark}/>
            </DField>
            <DField label="เขตเลือกตั้ง" T={T}>
              <Dropdown value={state.district} onChange={setDistrict}
                options={districtsForProvince.map((d) => ({ value: String(d), label: `เขต ${d}` }))}
                placeholder="เลือกเขต" disabled={!state.province} accent={accent.zone} dark={dark}/>
            </DField>
            <div style={{ gridColumn: '1 / -1' }}>
              <DField label="ประเภทหน่วย" T={T}>
                <Dropdown value={state.unitType} onChange={setUnitType}
                  options={[
                    { value: 'normal', label: 'คะแนนหน้าหน่วย' },
                    { value: 'advance-in', label: 'เลือกตั้งล่วงหน้าในเขต' },
                    { value: 'advance-out', label: 'เลือกตั้งล่วงหน้านอกเขต/นอกราชอาณาจักร' },
                  ]}
                  placeholder="เลือกประเภท" disabled={!state.district} accent={accent.zone} dark={dark}/>
              </DField>
            </div>
            {state.unitType === 'normal' && (
              <>
                <DField label="อำเภอ/เขต" T={T}>
                  <Dropdown value={state.amphoe} onChange={setAmphoe}
                    options={Object.keys(amphoesObj).map((a) => ({ value: a, label: a }))}
                    placeholder="เลือกอำเภอ" accent={accent.zone} dark={dark}/>
                </DField>
                <DField label="ตำบล/แขวง" T={T}>
                  <Dropdown value={state.tambon} onChange={setTambon}
                    options={Object.keys(tambonsObj).map((t) => ({ value: t, label: t }))}
                    placeholder="เลือกตำบล" disabled={!state.amphoe} accent={accent.zone} dark={dark}/>
                </DField>
                <div style={{ gridColumn: '1 / -1' }}>
                  <DField label="หน่วยเลือกตั้ง" T={T}>
                    <Dropdown value={state.unit}
                      onChange={(u) => { const f = unitsList.find((x) => x.unit === u); setUnit(u, f?.place); }}
                      options={unitsList.map((u) => ({ value: u.unit, label: `หน่วยที่ ${u.unit}` }))}
                      placeholder="เลือกหน่วย" disabled={!state.tambon} accent={accent.zone} dark={dark}/>
                    {state.place && (
                      <div style={{ marginTop: 8, display: 'flex', gap: 6, alignItems: 'center', color: T.muted, fontSize: 13 }}>
                        <Icon.Pin size={13}/> {state.place}
                      </div>
                    )}
                  </DField>
                </div>
              </>
            )}
            {isSpecialUnit && (
              <div style={{ gridColumn: '1 / -1' }}>
                <DField label="ใบที่" T={T}>
                  <input type="text" inputMode="numeric" pattern="[0-9]*" value={state.sheetNo}
                    onChange={(e) => setSheetNo(e.target.value.replace(/[^0-9]/g, '').slice(0, 2))}
                    placeholder="เช่น 1, 2, 3..."
                    style={{
                      width: '100%', background: dark ? '#1c1c20' : '#fff', color: T.fg,
                      border: `1px solid ${T.border}`, borderRadius: 12,
                      padding: '14px 16px', fontSize: 16, fontFamily: 'inherit',
                      outline: 'none', fontWeight: 500,
                    }}/>
                  <div style={{ marginTop: 8, fontSize: 12, color: T.muted, lineHeight: 1.5 }}>
                    📄 อ้างอิงจากเอกสารใน Google Drive โฟลเดอร์ของเขตนี้ — แต่ละเขตมีจำนวนใบไม่เท่ากัน
                  </div>
                </DField>
              </div>
            )}
          </div>
        </div>
      </div>
      <DFooter T={T}>
        <div style={{ fontSize: 12, color: T.muted }}>ข้อมูลจะบันทึกเมื่อกดส่งในขั้นสุดท้ายเท่านั้น</div>
        <DPrimary disabled={!locationValid} accent={accent.zone} onClick={() => goStep(2)}>
          ดำเนินการต่อ <Icon.ChevronRight size={14}/>
        </DPrimary>
      </DFooter>
    </div>
  );
}

function DType({ flow, T, accent, narrow }) {
  const { state, setType, goStep } = flow;
  const themeAccent = state.type === 'party' ? accent.party : accent.zone;
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Enter' && state.type) goStep(3); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [state.type, goStep]);
  const cards = [
    { id: 'zone', icon: <Icon.Map size={32} stroke={1.4}/>, title: 'แบบแบ่งเขต', sub: 'เลือกตัวบุคคล', desc: 'นับคะแนน ส.ส. แบบรายเขต', color: accent.zone },
    { id: 'party', icon: <Icon.List size={32} stroke={1.4}/>, title: 'บัญชีรายชื่อ', sub: 'เลือกพรรค', desc: 'นับคะแนนแบบบัญชีรายชื่อ', color: accent.party },
  ];
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: narrow ? '24px 16px' : '36px 32px' }}>
        <div style={{ maxWidth: 880, margin: '0 auto' }}>
          <div style={{ marginBottom: 28 }}>
            <h1 style={{ fontSize: narrow ? 24 : 28, fontWeight: 600, letterSpacing: '-0.02em', marginBottom: 6 }}>ประเภทคะแนน</h1>
            <p style={{ fontSize: 14, color: T.muted }}>เลือกหนึ่งประเภท ระบบจะแสดงรายชื่อให้กรอกคะแนน</p>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 1fr', gap: 16 }}>
            {cards.map((c) => {
              const sel = state.type === c.id;
              return (
                <button key={c.id} onClick={() => setType(c.id)} style={{
                  background: sel ? `${c.color}10` : T.surface,
                  border: `1.5px solid ${sel ? c.color : T.border}`,
                  borderRadius: 16, padding: 28, textAlign: 'left',
                  fontFamily: 'inherit', color: T.fg, cursor: 'pointer',
                  transition: 'all 0.15s',
                  boxShadow: sel ? `0 0 0 4px ${c.color}20` : 'none',
                  display: 'flex', flexDirection: 'column', gap: 16, minHeight: 200,
                }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: 14,
                    background: `${c.color}15`, color: c.color,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>{c.icon}</div>
                  <div>
                    <div style={{ fontSize: 22, fontWeight: 600, letterSpacing: '-0.01em' }}>{c.title}</div>
                    <div style={{ fontSize: 13, color: T.muted, marginTop: 3 }}>{c.sub}</div>
                    <div style={{ fontSize: 13, color: T.muted, marginTop: 12, lineHeight: 1.5 }}>{c.desc}</div>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
      <DFooter T={T}>
        <DGhost T={T} onClick={() => goStep(1)}><Icon.ChevronLeft size={14}/> ย้อนกลับ</DGhost>
        <DPrimary disabled={!state.type} accent={themeAccent} onClick={() => goStep(3)}>
          ดำเนินการต่อ <Icon.ChevronRight size={14}/>
        </DPrimary>
      </DFooter>
    </div>
  );
}

// Shared editable form for desktop (used in step 3 and in step 4 when alert)
function DesktopScoreForm({ flow, T, accent, dark, autoFocusFirst, onLastEnter }) {
  const { state, candidates, parties, setScore } = flow;
  const list = state.type === 'zone' ? candidates : parties;
  const usedKey = `used-${state.type}`;
  const validKey = `valid-${state.type}`;
  const invKey = `invalid-${state.type}`;
  const novKey = `noVote-${state.type}`;
  return (
    <>
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: 'hidden', marginBottom: 14 }}>
        <div style={{ padding: '14px 20px', borderBottom: `1px solid ${T.border}`, fontSize: 12, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5 }}>
          สรุปบัตร
        </div>
        <DSpecial T={T} dark={dark} accent={accent} color={accent} autoFocus={autoFocusFirst}
          label="บัตรเลือกตั้งที่ใช้" sub="จำนวนบัตรที่ใช้ทั้งหมดในใบนี้"
          value={state.scores[usedKey]} onChange={(v) => setScore(usedKey, v)}
          onLastEnter={onLastEnter}/>
        <DSpecial T={T} dark={dark} accent={accent} color="#22c55e"
          label="บัตรดี" sub="บัตรที่ลงคะแนนสมบูรณ์"
          value={state.scores[validKey]} onChange={(v) => setScore(validKey, v)} border
          onLastEnter={onLastEnter}/>
        <DSpecial T={T} dark={dark} accent={accent} color="#f59e0b"
          label="บัตรเสีย" sub="บัตรที่ใช้ไม่ได้"
          value={state.scores[invKey]} onChange={(v) => setScore(invKey, v)} border
          onLastEnter={onLastEnter}/>
        <DSpecial T={T} dark={dark} accent={accent} color="#ef4444"
          label="บัตรไม่เลือกผู้สมัครใด" sub="ลงคะแนนไม่ประสงค์"
          value={state.scores[novKey]} onChange={(v) => setScore(novKey, v)} border
          onLastEnter={onLastEnter}/>
      </div>
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: 'hidden' }}>
        <div style={{ padding: '14px 20px', borderBottom: `1px solid ${T.border}`, fontSize: 12, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5 }}>
          {state.type === 'zone' ? 'ผู้สมัคร' : 'พรรค'}
        </div>
        {list.map((item, i) => (
          <DScoreRow key={item.no} item={item} state={state} setScore={setScore}
            T={T} accent={accent} dark={dark}
            isLast={i === list.length - 1} type={state.type}
            onLastEnter={onLastEnter}/>
        ))}
      </div>
    </>
  );
}

function DScores({ flow, T, accent, dark, narrow }) {
  const { state, candidates, parties, goStep } = flow;
  const totals = computeTotals(flow);
  const validation = buildValidation(state, totals);
  const advanceToConfirm = () => goStep(4);
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: narrow ? '20px 16px' : '28px 32px' }}>
        <div style={{ maxWidth: 820, margin: '0 auto' }}>
          <div style={{ marginBottom: 20 }}>
            <h1 style={{ fontSize: narrow ? 22 : 26, fontWeight: 600, letterSpacing: '-0.02em', marginBottom: 4 }}>กรอกคะแนน</h1>
            <p style={{ fontSize: 13, color: T.muted }}>
              {state.type === 'zone' ? `${candidates.length} ผู้สมัคร · แบ่งเขต` : `${parties.length} พรรค · บัญชีรายชื่อ`}
            </p>
          </div>

          <LiveValidationStatus T={T} totals={totals} validation={validation} dark={dark}/>

          <DesktopScoreForm flow={flow} T={T} accent={accent} dark={dark}
            autoFocusFirst onLastEnter={advanceToConfirm}/>
        </div>
      </div>
      <DFooter T={T}>
        <DGhost T={T} onClick={() => goStep(2)}><Icon.ChevronLeft size={14}/> ย้อนกลับ</DGhost>
        <DPrimary accent={accent} onClick={() => goStep(4)}>ตรวจสอบก่อนส่ง <Icon.ChevronRight size={14}/></DPrimary>
      </DFooter>
    </div>
  );
}

function DScoreRow({ item, state, setScore, T, accent, dark, isLast, type, onLastEnter }) {
  const k = type === 'zone' ? `score-${item.no}` : `party-${item.no}`;
  return (
    <div style={{
      padding: '12px 20px',
      borderBottom: isLast ? 'none' : `1px solid ${T.border}`,
      display: 'grid', gridTemplateColumns: 'auto 1fr 130px', gap: 16, alignItems: 'center',
    }}>
      <div style={{
        width: 32, height: 32, borderRadius: 8,
        background: `${accent}15`, color: accent,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 14, fontWeight: 700,
      }}>{item.no}</div>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 500, color: T.fg }}>{item.name}</div>
        {item.party && <div style={{ fontSize: 12, color: T.muted, marginTop: 1 }}>{item.party}</div>}
      </div>
      <ScoreInput value={state.scores[k]} onChange={(v) => setScore(k, v)} dark={dark} accent={accent}
        onLastEnter={onLastEnter}/>
    </div>
  );
}

function DSpecial({ T, dark, accent, color, label, sub, value, onChange, border, autoFocus, onLastEnter }) {
  return (
    <div style={{
      padding: '14px 20px',
      borderTop: border ? `1px solid ${T.border}` : 'none',
      display: 'grid', gridTemplateColumns: 'auto 1fr 130px', gap: 16, alignItems: 'center',
    }}>
      <div style={{ width: 12, height: 12, borderRadius: '50%', background: color }}/>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 500 }}>{label}</div>
        {sub && <div style={{ fontSize: 12, color: T.muted, marginTop: 1 }}>{sub}</div>}
      </div>
      <ScoreInput value={value} onChange={onChange} dark={dark} accent={accent}
        autoFocus={autoFocus} onLastEnter={onLastEnter}/>
    </div>
  );
}

function DConfirm({ flow, T, accent, narrow }) {
  const { state, submit, setOverride, setOther, setOverrideNote } = flow;
  const totals = computeTotals(flow);
  const validation = buildValidation(state, totals);
  const { hasBlocking } = validation;
  const canSubmit = !hasBlocking || state.override || (state.other && state.overrideNote.trim().length > 0);
  const dark = T.bg === '#0a0a0a';
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}
         onKeyDown={(e) => { if (e.key === 'Enter' && canSubmit && !state.submitting && e.target?.tagName !== 'TEXTAREA') submit(); }}>
      <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: narrow ? '20px 16px' : '28px 32px' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto' }}>
          <div style={{ marginBottom: 20 }}>
            <h1 style={{ fontSize: narrow ? 22 : 26, fontWeight: 600, letterSpacing: '-0.02em', marginBottom: 4 }}>ยืนยันก่อนส่ง</h1>
            <p style={{ fontSize: 13, color: T.muted }}>โปรดตรวจทานให้ละเอียด เมื่อส่งแล้วจะแก้ไขไม่ได้อีก</p>
          </div>
          {hasBlocking ? (
            <>
              {/* Top row: Alert + Override side-by-side on wide screens; stacked on narrow */}
              <div style={{ display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 360px', gap: 16, alignItems: 'start', marginBottom: 16 }}>
                <ValidationAlert T={T} validation={validation} dark={dark}/>
                <OverrideBox T={T} state={state} setOverride={setOverride} setOther={setOther}
                  setOverrideNote={setOverrideNote} dark={dark}/>
              </div>
              {/* Hint */}
              <div style={{
                padding: '10px 14px', borderRadius: 10, fontSize: 12,
                background: dark ? '#1e2a3a' : '#eff6ff',
                color: dark ? '#93c5fd' : '#1e40af',
                marginBottom: 12, lineHeight: 1.5,
              }}>
                ✏️ แก้ค่าด้านล่างได้เลย — alert จะหายเองเมื่อผลรวมตรงกัน
              </div>
              {/* Bottom row: Score form + unit summary */}
              <div style={{ display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 360px', gap: 16, alignItems: 'start' }}>
                <DesktopScoreForm flow={flow} T={T} accent={accent} dark={dark}/>
                <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20, position: narrow ? 'static' : 'sticky', top: 0 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 10 }}>หน่วย</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 13 }}>
                    <DSumRow label="จังหวัด" value={state.province} T={T}/>
                    <DSumRow label="เขต" value={`เขต ${state.district}`} T={T}/>
                    {state.unit && <DSumRow label="หน่วย" value={state.unit} T={T}/>}
                    {state.sheetNo && <DSumRow label="ใบที่" value={state.sheetNo} T={T}/>}
                    {state.place && <DSumRow label="สถานที่" value={state.place} T={T}/>}
                    <DSumRow label="ประเภท" value={state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ'} T={T} accent={accent}/>
                  </div>
                </div>
              </div>
            </>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 360px', gap: 16 }}>
              <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, overflow: 'hidden' }}>
                <div style={{ padding: '12px 18px', borderBottom: `1px solid ${T.border}`, fontSize: 12, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  คะแนนที่จะส่ง — {state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ'}
                </div>
                <div style={{ padding: '11px 18px', display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: `1px solid ${T.border}`, background: T.bg }}>
                  <span style={{ color: T.muted, fontWeight: 500 }}>บัตรเลือกตั้งที่ใช้</span>
                  <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.used)}</span>
                </div>
                <div style={{ padding: '11px 18px', display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: `1px solid ${T.border}`, background: T.bg }}>
                  <span style={{ color: '#22c55e', fontWeight: 500 }}>บัตรดี</span>
                  <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.valid)}</span>
                </div>
                <div style={{ padding: '11px 18px', display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: `1px solid ${T.border}`, background: T.bg }}>
                  <span style={{ color: '#f59e0b', fontWeight: 500 }}>บัตรเสีย</span>
                  <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.invalid)}</span>
                </div>
                <div style={{ padding: '11px 18px', display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: `1px solid ${T.border}`, background: T.bg }}>
                  <span style={{ color: '#ef4444', fontWeight: 500 }}>บัตรไม่เลือกผู้สมัครใด</span>
                  <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.noVote)}</span>
                </div>
                <div style={{ maxHeight: 380, overflowY: 'auto' }}>
                  {totals.rows.map((r) => (
                    <div key={r.key} style={{
                      padding: '10px 18px',
                      display: 'flex', justifyContent: 'space-between', gap: 12,
                      fontSize: 13, borderBottom: `1px solid ${T.border}`,
                    }}>
                      <span style={{ color: T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        <span style={{ color: accent, fontWeight: 600 }}>{r.no}.</span> {r.name}
                      </span>
                      <span style={{ color: T.fg, fontWeight: 500, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmt(r.value)}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 10 }}>หน่วย</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 13 }}>
                    <DSumRow label="จังหวัด" value={state.province} T={T}/>
                    <DSumRow label="เขต" value={`เขต ${state.district}`} T={T}/>
                    {state.unit && <DSumRow label="หน่วย" value={state.unit} T={T}/>}
                    {state.sheetNo && <DSumRow label="ใบที่" value={state.sheetNo} T={T}/>}
                    {state.place && <DSumRow label="สถานที่" value={state.place} T={T}/>}
                    <DSumRow label="ประเภท" value={state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ'} T={T} accent={accent}/>
                  </div>
                </div>
                <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>คะแนนผู้สมัครรวม</div>
                  <div style={{ fontSize: 40, fontWeight: 600, color: accent, letterSpacing: '-0.03em', lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>
                    {fmt(totals.sumScores)}
                  </div>
                  <div style={{ marginTop: 4, fontSize: 12, color: T.muted }}>ควรเท่ากับ บัตรดี ({fmt(totals.valid)})</div>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
      <DFooter T={T}>
        <DGhost T={T} onClick={() => flow.goStep(3)}><Icon.ChevronLeft size={14}/> กลับไปแก้ไข</DGhost>
        <DPrimary accent={accent} onClick={() => submit()} disabled={state.submitting || !canSubmit}>
          {state.submitting ? <><Icon.Spinner size={14}/> กำลังส่ง…</> : <><Icon.Send size={14}/> ส่งคะแนนเข้าระบบ</>}
        </DPrimary>
      </DFooter>
    </div>
  );
}

    <div style={{
      width: '100%', height: '100%',

          <div style={{
            background: T.bg, border: `1px solid ${T.border}`,
            borderRadius: 14, padding: '18px 20px', marginBottom: 24,
            display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 1fr', gap: 14, textAlign: 'left',
          }}>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>หน่วย</div>

                {state.province} · เขต {state.district}{state.unit ? ` · หน่วย ${state.unit}` : ''}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>ประเภท</div>
              <div style={{ fontSize: 13, fontWeight: 500, color: accent }}>
                {state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ'}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>บัตรดี</div>
              <div style={{ fontSize: 13, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.valid)}</div>

// Thai province codes (official) for our 9 in-scope provinces
const PROVINCE_CODES = {
  'นนทบุรี': 12, 'ระยอง': 21, 'นครราชสีมา': 30, 'บุรีรัมย์': 31,
  'ชัยภูมิ': 36, 'หนองบัวลำภู': 39, 'ขอนแก่น': 40, 'พะเยา': 56,
  'ปัตตานี': 94,
};

// ============================================================
// VOLUNTEER — registration + submission_id formatting
// ============================================================
function loadVolunteer() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_VOLUNTEER) || 'null');
    if (!v || !v.code || !v.name) return null;
    // Migrate old format (KAN-7A3F) → new format (KAN)
    if (v.code.includes('-')) {
      v.code = generateVolCode(v.name);
      saveVolunteer(v);
    }
    return v;
  } catch { return null; }
}
function saveVolunteer(v) {
  localStorage.setItem(STORAGE_VOLUNTEER, JSON.stringify(v));
}
function clearVolunteer() {
  localStorage.removeItem(STORAGE_VOLUNTEER);
  localStorage.removeItem(STORAGE_SEQ);
}
function generateVolCode(name) {
  // First 3 letters of English name, uppercase, padded with X if shorter
  return (name || '').replace(/[^a-zA-Z]/g, '').slice(0, 3).toUpperCase().padEnd(3, 'X');
}
function getSeq() {
  return parseInt(localStorage.getItem(STORAGE_SEQ) || '0', 10) || 0;
}
function nextSeq() {
  const next = getSeq() + 1;
  localStorage.setItem(STORAGE_SEQ, String(next));
  return next;
}
function pad(n, d) { return String(n).padStart(d, '0'); }
function unitTypeShortCode(t) {
  return t === 'advance-out' ? 'OUT'
       : t === 'advance-in'  ? 'INA'
       : t === 'overseas'    ? 'OVR' : '';
}
function formatSubmissionId(volCode, state, seq) {
  const prov = pad(PROVINCE_CODES[state.province] || 0, 2);
  const dist = pad(parseInt(state.district) || 0, 2);
  let unit;
  if (state.unitType === 'normal') {
    unit = pad(parseInt(state.unit) || 0, 3);
  } else {
    const code = unitTypeShortCode(state.unitType);
    const sheet = pad(parseInt(state.sheetNo) || 0, 2);
    unit = `${code}${sheet}`;
  }
  return `${volCode}-${prov}${dist}-${unit}-${pad(seq, 3)}`;
}

// ============================================================
// HELPERS — backend wiring (collectData, submit, retry, queue)
// ============================================================
function collectData(state, volunteer, submissionId) {
  const ts = new Date().toISOString();
  const list = state.type === 'zone'
    ? (SAMPLE_DATA.candidates[`${state.province}|${state.district}`] || [])
    : (SAMPLE_DATA.parties || []);
  const ptype = state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ';
  const isNormal = state.unitType === 'normal';
  // Compute diffs for analytics — preserved per row even when override fires
  let sumScores = 0;
  list.forEach((item) => {
    const k = state.type === 'zone' ? `score-${item.no}` : `party-${item.no}`;
    sumScores += parseInt(state.scores[k] || 0) || 0;
  });
  const usedT  = parseInt(state.scores[`used-${state.type}`]    || 0) || 0;
  const validT = parseInt(state.scores[`valid-${state.type}`]   || 0) || 0;
  const invT   = parseInt(state.scores[`invalid-${state.type}`] || 0) || 0;
  const novT   = parseInt(state.scores[`noVote-${state.type}`]  || 0) || 0;
  const diff_sum_vs_valid  = sumScores - validT;
  const diff_grand_vs_used = (validT + invT + novT) - usedT;
  const base = {
    timestamp: ts,
    submission_id: submissionId,
    volunteer_code: volunteer?.code || '',
    volunteer_name: volunteer?.name || '',
    'จังหวัด': state.province,
    'เขต': state.district,
    'unitType': state.unitType,
    'อำเภอ': isNormal ? state.amphoe : '',
    'ตำบล': isNormal ? state.tambon : '',
    'หน่วย': isNormal ? state.unit : '',
    'สถานที่': isNormal ? state.place : '',
    'ใบที่': !isNormal ? state.sheetNo : '',
    'ประเภท': ptype,
    'override': state.override ? 'GOV_WRONG' : (state.other ? 'OTHER' : ''),
    'หมายเหตุ': state.overrideNote || '',
    'diff_sum_vs_valid': diff_sum_vs_valid,
    'diff_grand_vs_used': diff_grand_vs_used,
  };
  const usedKey = `used-${state.type}`;
  const validKey = `valid-${state.type}`;
  const invKey = `invalid-${state.type}`;
  const novKey = `noVote-${state.type}`;
  const rows = [];
  rows.push({ ...base, 'เบอร์': '', 'ชื่อ/รายการ': 'บัตรที่ใช้',  'คะแนน': parseInt(state.scores[usedKey]  || 0) || 0 });
  rows.push({ ...base, 'เบอร์': '', 'ชื่อ/รายการ': 'บัตรดี',     'คะแนน': parseInt(state.scores[validKey] || 0) || 0 });
  rows.push({ ...base, 'เบอร์': '', 'ชื่อ/รายการ': 'บัตรเสีย',   'คะแนน': parseInt(state.scores[invKey]   || 0) || 0 });
  rows.push({ ...base, 'เบอร์': '', 'ชื่อ/รายการ': 'บัตรไม่เลือก', 'คะแนน': parseInt(state.scores[novKey]   || 0) || 0 });
  list.forEach((item) => {
    const k = state.type === 'zone' ? `score-${item.no}` : `party-${item.no}`;
    rows.push({
      ...base,
      'เบอร์': item.no,
      'ชื่อ/รายการ': item.name,
      'คะแนน': parseInt(state.scores[k] || 0) || 0,
    });
  });
  return rows;
}

async function submitWithRetry(payload, maxAttempts = 4) {
  if (APPS_SCRIPT_URL === 'YOUR_URL_HERE') {
    await new Promise((r) => setTimeout(r, 1200));
    const sid = (Array.isArray(payload) && payload[0] && payload[0].submission_id) || ('DEMO-' + Date.now().toString().slice(-6));
    return { status: 'ok', submission_id: sid };
  }
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      });
      const result = await res.json();
      if (result.status === 'ok') return result;
      throw new Error(result.message || 'Server error');
    } catch (e) {
      lastErr = e;
      if (attempt < maxAttempts) {
        await new Promise((r) => setTimeout(r, 1000 * Math.pow(2, attempt - 1)));
      }
    }
  }
  throw lastErr;
}

function getPending() {
  try { return JSON.parse(localStorage.getItem(STORAGE_PENDING) || '[]'); }
  catch { return []; }
}
function setPendingQueue(arr) {
  localStorage.setItem(STORAGE_PENDING, JSON.stringify(arr));
}
async function flushPending(onUpdate) {
  const queue = getPending();
  if (queue.length === 0) {
    if (onUpdate) onUpdate(0);
    return { sent: 0, remaining: 0 };
  }
  const remaining = [];
  let sent = 0;
  for (const item of queue) {
    try {
      const r = await submitWithRetry(item.payload, 2);
      if (r.status === 'ok') sent++;
      else remaining.push(item);
    } catch {
      remaining.push(item);
    }
  }
  setPendingQueue(remaining);
  if (onUpdate) onUpdate(remaining.length);
  return { sent, remaining: remaining.length };
}

// ============================================================
// VALIDATION — produce structured checks (diagnostic-style)
// ============================================================
function buildValidation(state, totals) {
  const allZero = totals.sumScores === 0 && totals.used === 0 && totals.valid === 0
                  && totals.invalid === 0 && totals.noVote === 0;
  const hasNegative = totals.used < 0 || totals.valid < 0 || totals.invalid < 0 || totals.noVote < 0
                   || totals.rows.some((r) => r.value < 0);
  const simpleErrors = [];
  if (allZero) simpleErrors.push('คะแนนทั้งหมดเป็น 0 — ยังไม่ได้กรอกใช่ไหม?');
  if (hasNegative) simpleErrors.push('มีคะแนนติดลบ — กรุณาแก้ไข ก่อนส่ง');

  const checks = allZero ? [] : [
    {
      id: 'cand',
      ok: totals.sumScores === totals.valid,
      label: 'จำนวนบัตรไม่ตรงกัน',
      left:  { name: 'ผลรวมคะแนนผู้สมัคร', value: totals.sumScores },
      right: { name: 'บัตรดี', value: totals.valid },
    },
    {
      id: 'ballot',
      ok: totals.grand === totals.used,
      label: 'จำนวนบัตรไม่ตรงกัน',
      left:  { name: 'บัตรดี + บัตรเสีย + บัตรไม่เลือก', value: totals.grand,
               parts: [totals.valid, totals.invalid, totals.noVote] },
      right: { name: 'บัตรเลือกตั้งที่ใช้', value: totals.used },
    },
  ];

  const failedChecks = checks.filter((c) => !c.ok);
  const hasBlocking = simpleErrors.length > 0 || failedChecks.length > 0;
  return { simpleErrors, checks, failedChecks, hasBlocking };
}

  if (!anyTouched) return null;
  const ok = '#16a34a';
  const danger = '#ef4444';
  const Item = ({ check, leftLabel, leftVal, rightLabel, rightVal }) => {
    const isOk = check.ok;
    const diff = leftVal - rightVal;

    const bg = isOk ? (dark ? `${ok}15` : `${ok}10`) : (dark ? `${danger}15` : `${danger}10`);
    return (
      <div style={{

        </span>
        {!isOk && (

            ต่าง {diff > 0 ? '+' : ''}{fmt(diff)}
          </span>
        )}
      </div>
    );
  };
  const c1 = validation.checks.find((x) => x.id === 'cand');
  const c2 = validation.checks.find((x) => x.id === 'ballot');

    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 14 }}>
      {c1 && <Item check={c1} leftLabel="ผลรวมคะแนน" leftVal={totals.sumScores}
        rightLabel="บัตรดี" rightVal={totals.valid}/>}
      {c2 && <Item check={c2} leftLabel="บัตรดี+เสีย+ไม่เลือก" leftVal={totals.grand}
        rightLabel="บัตรที่ใช้" rightVal={totals.used}/>}
    </div>
  );
}

// ============================================================
// REGISTRATION SCREEN — first-time volunteer setup
// ============================================================
function RegistrationScreen({ onRegister, theme, setTheme }) {
  const [name, setName] = React.useState('');
  const [touched, setTouched] = React.useState(false);
  const dark = theme === 'dark';

  const trimmed = name.trim();
  const valid = /^[a-zA-Z]{2,15}$/.test(trimmed);
  const showError = touched && trimmed.length > 0 && !valid;

  const T = dark ? {
    bg: '#0a0a0a', surface: '#16161a', border: '#27272a', borderStrong: '#3f3f46',
    fg: '#fafafa', muted: '#a1a1aa', subtle: '#71717a',
  } : {
    bg: '#f5f5f7', surface: '#fff', border: '#e4e4e7', borderStrong: '#d4d4d8',
    fg: '#18181b', muted: '#52525b', subtle: '#a1a1aa',
  };

  const accent = ACCENT.zone;
  const submit = () => { if (valid) onRegister(trimmed); };

  return (
    <div style={{
      width: '100%', height: '100%', background: T.bg, color: T.fg,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      <div style={{
        position: 'absolute', top: 14, right: 16, zIndex: 2,
      }}>
        <ThemeToggle theme={theme} setTheme={setTheme} T={T}/>
      </div>
      <div style={{
        flex: 1, minHeight: 0, overflowY: 'auto',
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '32px 20px',
      }}>
        <div style={{
          maxWidth: 460, width: '100%',
          background: T.surface, border: `1px solid ${T.border}`,
          borderRadius: 22, padding: '36px 28px',
          animation: 'cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2)',
        }}>
          <div style={{
            width: 56, height: 56, borderRadius: 14,
            background: `${accent}15`, color: accent,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 20,
          }}><Icon.Ballot size={28} stroke={2}/></div>
          <h1 style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em', marginBottom: 8 }}>
            ยินดีต้อนรับ
          </h1>
          <p style={{ fontSize: 14, color: T.muted, lineHeight: 1.55, marginBottom: 24 }}>
            ก่อนเริ่มกรอกคะแนน กรุณากรอกชื่อภาษาอังกฤษ ระบบจะใช้สำหรับระบุที่มาของข้อมูล
            (กรอกครั้งเดียวต่อเครื่อง)
          </p>
          <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: T.muted, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.5 }}>
            ชื่อ (English)
          </label>
          <input type="text" value={name}
            placeholder="เช่น ilaw"
            onChange={(e) => setName(e.target.value)}
            onBlur={() => setTouched(true)}
            onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
            autoFocus
            style={{
              width: '100%',
              background: dark ? '#1c1c20' : '#fff', color: T.fg,
              border: `1px solid ${showError ? '#ef4444' : T.border}`,
              borderRadius: 12, padding: '14px 16px',
              fontSize: 16, fontFamily: 'inherit',
              outline: 'none',
              transition: 'border-color 0.15s, box-shadow 0.15s',
              boxShadow: showError ? '0 0 0 4px rgba(239,68,68,0.12)' : 'none',
            }}/>
          {showError && (
            <div style={{ marginTop: 8, fontSize: 12, color: '#ef4444' }}>
              ใช้ตัวอักษร a-z / A-Z เท่านั้น 2-15 ตัวอักษร
            </div>
          )}
          {valid && (
            <div style={{ marginTop: 12, padding: '12px 14px', borderRadius: 10,
              background: dark ? '#0c2418' : '#ecfdf5',
              color: dark ? '#86efac' : '#065f46',
              fontSize: 13, lineHeight: 1.5,
            }}>
              <div>รหัสที่จะได้: <b style={{ fontFamily: 'ui-monospace, monospace' }}>{trimmed.slice(0,3).toUpperCase().padEnd(3,'X')}</b></div>
              <div style={{ fontSize: 11, color: dark ? '#a7f3d0' : '#047857', marginTop: 2 }}>
                3 ตัวแรกของชื่อ (พิมพ์ใหญ่) — ใช้นำหน้ารหัสยืนยันแต่ละครั้ง
              </div>
            </div>
          )}
          <button onClick={submit} disabled={!valid} style={{
            width: '100%', marginTop: 20, padding: '15px 20px',
            background: valid ? accent : (dark ? '#27272a' : '#e4e4e7'),
            color: valid ? '#fff' : T.muted,
            border: 'none', borderRadius: 14,
            fontSize: 16, fontWeight: 600, fontFamily: 'inherit',
            cursor: valid ? 'pointer' : 'not-allowed',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          }}>
            เริ่มกรอกคะแนน <Icon.ChevronRight size={16}/>
          </button>
          <div style={{ marginTop: 16, padding: '10px 12px', borderRadius: 8,
            background: dark ? '#0c1a2e' : '#eff6ff',
            color: dark ? '#93c5fd' : '#1e40af',
            fontSize: 12, lineHeight: 1.5,
          }}>
            ℹ️ ข้อมูลนี้บันทึกในเครื่องของคุณเท่านั้น เพื่อระบุว่าใครเป็นคนกรอก ในรหัสยืนยันแต่ละหน่วย
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// VOLUNTEER BADGE — header indicator + change-user popover
// ============================================================
function VolunteerBadge({ volunteer, onChangeUser, T, narrow }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const seq = getSeq();
  const dark = T.bg === '#0a0a0a' || T.bg === '#000';
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen((o) => !o)} title={volunteer.name} style={{
        background: T.surface, color: T.fg,
        border: `1px solid ${T.border}`, borderRadius: 100,
        padding: narrow ? '5px 10px' : '6px 12px',
        fontSize: 12, fontFamily: 'ui-monospace, monospace', fontWeight: 600,
        cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6,
        flexShrink: 0,
      }}>
        <span style={{ fontSize: 13 }}>👤</span>
        {volunteer.code}
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 8px)', right: 0,
          background: T.surface, border: `1px solid ${T.border}`,
          borderRadius: 12, padding: 14, minWidth: 220, zIndex: 100,
          boxShadow: dark ? '0 12px 32px rgba(0,0,0,0.5)' : '0 12px 32px rgba(0,0,0,0.12)',
        }}>
          <div style={{ fontSize: 11, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5, fontWeight: 600, marginBottom: 4 }}>ผู้ใช้</div>
          <div style={{ fontSize: 15, fontWeight: 600, color: T.fg, marginBottom: 8 }}>{volunteer.name}</div>
          <div style={{ fontSize: 11, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5, fontWeight: 600, marginBottom: 4 }}>รหัสประจำเครื่อง</div>
          <div style={{ fontSize: 13, fontFamily: 'ui-monospace, monospace', fontWeight: 600, color: ACCENT.zone, marginBottom: 12 }}>{volunteer.code}</div>
          <div style={{ fontSize: 12, color: T.muted, marginBottom: 12 }}>กรอกแล้ว <b style={{ color: T.fg }}>{seq}</b> หน่วย</div>
          <button onClick={() => { setOpen(false); onChangeUser(); }} style={{
            width: '100%', padding: '8px 12px',
            background: 'transparent', color: T.fg,
            border: `1px solid ${T.border}`, borderRadius: 8,
            fontSize: 13, fontFamily: 'inherit', cursor: 'pointer', fontWeight: 500,
          }}>
            เปลี่ยนผู้ใช้
          </button>
        </div>
      )}
    </div>
  );
}

// ============================================================
// APP — viewport-aware variant switch + theme toggle
// State is lifted here so resize across 600px breakpoint preserves it
// ============================================================
function App() {
  const [theme, setTheme] = React.useState(() => {
    if (typeof window === 'undefined') return 'light';
    const saved = localStorage.getItem(STORAGE_THEME);
    if (saved) return saved;
    return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  React.useEffect(() => { localStorage.setItem(STORAGE_THEME, theme); }, [theme]);

  const [isMobile, setIsMobile] = React.useState(() => window.innerWidth < 600);
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 600);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const [volunteer, setVolunteer] = React.useState(loadVolunteer);
  const flow = useElectionFlow(volunteer);

  const [pendingCount, setPendingCount] = React.useState(() => getPending().length);
  const [flushing, setFlushing] = React.useState(false);
  React.useEffect(() => {
    if (getPending().length > 0) {
      setFlushing(true);
      flushPending(setPendingCount).finally(() => setFlushing(false));
    }
  }, []);
  const onResendPending = React.useCallback(async () => {
    if (flushing) return;
    setFlushing(true);
    try { await flushPending(setPendingCount); }
    finally { setFlushing(false); }
  }, [flushing]);

  const onRegister = (name) => {
    const v = { name, code: generateVolCode(name), registered_at: Date.now() };
    saveVolunteer(v);
    setVolunteer(v);
  };
  const onChangeUser = () => {
    if (window.confirm('ต้องการเปลี่ยนผู้ใช้? (จะลบข้อมูลผู้กรอกและเริ่มใหม่ — ข้อมูลที่ส่งไปแล้วยังอยู่)')) {
      clearVolunteer();
      setVolunteer(null);
      flow.fullReset();
    }
  };

  if (!volunteer) {
    return <RegistrationScreen onRegister={onRegister} theme={theme} setTheme={setTheme}/>;
  }

  return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      {isMobile
        ? <VariantCards flow={flow} theme={theme} setTheme={setTheme} accent={ACCENT}
            pendingCount={pendingCount} onResendPending={onResendPending} flushing={flushing}
            volunteer={volunteer} onChangeUser={onChangeUser}/>
        : <VariantDesktop flow={flow} theme={theme} setTheme={setTheme} accent={ACCENT}
            pendingCount={pendingCount} onResendPending={onResendPending} flushing={flushing}
            volunteer={volunteer} onChangeUser={onChangeUser}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
