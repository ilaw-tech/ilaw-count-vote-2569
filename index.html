const INITIAL_STATE = {
  step: 1, province: '', district: '', unitType: '',
  amphoe: '', tambon: '', unit: '', place: '',
  type: null, scores: {},
  submitting: false, submitted: false, submissionId: '',
};

// ============================================================
// SHARED — flow hook + atoms (Dropdown, ScoreInput)
// ============================================================
function useElectionFlow() {
  const [state, setState] = React.useState(INITIAL_STATE);
  const update = (patch) => setState((s) => ({ ...s, ...patch }));

  const setProvince = (p) => update({ province: p, district: '', unitType: '', amphoe: '', tambon: '', unit: '', place: '' });
  const setDistrict = (d) => update({ district: d, unitType: '', amphoe: '', tambon: '', unit: '', place: '' });
  const setUnitType = (t) => update({ unitType: t, amphoe: '', tambon: '', unit: '', place: '' });
  const setAmphoe = (a) => update({ amphoe: a, tambon: '', unit: '', place: '' });
  const setTambon = (t) => update({ tambon: t, unit: '', place: '' });
  const setUnit = (u, place) => update({ unit: u, place: place || '' });
  const setType = (t) => update({ type: t });
  const setScore = (key, val) => setState((s) => ({ ...s, scores: { ...s.scores, [key]: val } }));
  const goStep = (n) => update({ step: n });
  const reset = () => setState(INITIAL_STATE);

  const locationValid = state.province && state.district && (
    state.unitType === 'advance-out' ||
    state.unitType === 'overseas' ||
    (state.unitType === 'normal' && state.amphoe && state.tambon && state.unit)
  );

  const districtKey = state.province && state.district ? `${state.province}|${state.district}` : null;
  const districtsForProvince = React.useMemo(() => {
    const prov = SAMPLE_DATA.provinces.find((p) => p.name === state.province);
    return prov ? prov.districts : [];
  }, [state.province]);
  const amphoesObj = districtKey ? (SAMPLE_DATA.amphoes[districtKey] || {}) : {};
  const tambonsObj = state.amphoe ? (amphoesObj[state.amphoe] || {}) : {};
  const unitsList = state.tambon ? (tambonsObj[state.tambon] || []) : [];
  const candidates = districtKey ? (SAMPLE_DATA.candidates[districtKey] || []) : [];
  const parties = SAMPLE_DATA.parties;

  const submit = async () => {
    update({ submitting: true });
    await new Promise((r) => setTimeout(r, 1400));
    update({ submitting: false, submitted: true, submissionId: 'V' + Date.now().toString().slice(-6) });
  };

  return {
    state, update, setProvince, setDistrict, setUnitType,
    setAmphoe, setTambon, setUnit, setType, setScore,
    goStep, reset, submit,
    locationValid, districtKey, districtsForProvince,
    amphoesObj, tambonsObj, unitsList, candidates, parties,
  };
}

function computeTotals(flow) {
  const { state, candidates, parties } = flow;
  const list = state.type === 'zone' ? candidates : parties;
  let total = 0;
  const rows = list.map((item) => {
    const k = state.type === 'zone' ? `score-${item.no}` : `party-${item.no}`;
    const v = parseInt(state.scores[k] || 0) || 0;
    total += v;
    return { ...item, value: v, key: k };
  });
  const inv = parseInt(state.scores['invalid'] || 0) || 0;
  const novote = parseInt(state.scores['noVote'] || 0) || 0;
  return { rows, total, invalid: inv, noVote: novote, grand: total + inv + novote };
}

const fmt = (n) => (n || 0).toLocaleString('th-TH');

function Dropdown({ value, onChange, options, placeholder, disabled, accent = '#0071e3', dark }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  const selected = options.find((o) => o.value === value);
  const bg = dark ? '#1c1c1e' : '#fff';
  const border = dark ? '#2c2c2e' : '#d2d2d7';
  const fg = dark ? '#f5f5f7' : '#1d1d1f';
  const muted = '#86868b';
  const hover = dark ? '#2c2c2e' : '#f5f5f7';

  return (
    <div ref={ref} style={{ position: 'relative', width: '100%' }}>
      <button type="button" disabled={disabled} onClick={() => !disabled && setOpen((o) => !o)}
        style={{
          width: '100%', background: bg,
          border: `1px solid ${open ? accent : border}`,
          borderRadius: 12, padding: '14px 16px', fontSize: 16,
          fontFamily: 'inherit', color: selected ? fg : muted,
          textAlign: 'left', cursor: disabled ? 'not-allowed' : 'pointer',
          opacity: disabled ? 0.4 : 1,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
          transition: 'border-color 0.15s, box-shadow 0.15s',
          boxShadow: open ? `0 0 0 4px ${accent}1a` : 'none',
        }}>
        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {selected ? selected.label : placeholder}
        </span>
        <span style={{ color: muted, transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.15s' }}>
          <Icon.ChevronDown />
        </span>
      </button>
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 6px)', left: 0, right: 0,
          background: bg, border: `1px solid ${border}`, borderRadius: 12,
          boxShadow: dark ? '0 12px 32px rgba(0,0,0,0.5)' : '0 12px 32px rgba(0,0,0,0.12)',
          maxHeight: 280, overflowY: 'auto', zIndex: 50, padding: 6,
        }}>
          {options.length === 0 && (
            <div style={{ padding: 12, color: muted, fontSize: 14 }}>ไม่มีตัวเลือก</div>
          )}
          {options.map((o) => (
            <div key={o.value} onClick={() => { onChange(o.value); setOpen(false); }}
              style={{
                padding: '10px 12px', fontSize: 15, color: fg,
                borderRadius: 8, cursor: 'pointer',
                background: o.value === value ? `${accent}15` : 'transparent',
                fontWeight: o.value === value ? 600 : 400,
              }}
              onMouseEnter={(e) => { if (o.value !== value) e.currentTarget.style.background = hover; }}
              onMouseLeave={(e) => { if (o.value !== value) e.currentTarget.style.background = 'transparent'; }}>
              {o.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ScoreInput({ value, onChange, dark, accent }) {
  const [focused, setFocused] = React.useState(false);
  const bg = dark ? '#1c1c1e' : '#fff';
  const border = dark ? '#2c2c2e' : '#d2d2d7';
  const fg = dark ? '#f5f5f7' : '#1d1d1f';
  return (
    <input type="number" min="0" placeholder="0" value={value || ''}
      onChange={(e) => onChange(e.target.value)}
      onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
      style={{
        width: 92, background: bg, color: fg,
        border: `1px solid ${focused ? accent : border}`,
        borderRadius: 10, padding: '10px 12px',
        fontSize: 16, fontFamily: 'inherit', fontWeight: 500,
        textAlign: 'right', outline: 'none',
        transition: 'border-color 0.15s, box-shadow 0.15s',
        boxShadow: focused ? `0 0 0 4px ${accent}1a` : 'none',
      }}/>
  );
}

// ============================================================
// MOBILE — Card Stack (iOS-sheet pattern)
// ============================================================
function VariantCards({ theme, setTheme, accent }) {
  const flow = useElectionFlow();
  const { state } = flow;
  const dark = theme === 'dark';
  const themeAccent = state.type === 'party' ? accent.party : accent.zone;

  const T = dark ? {
    bg: '#000', surface: '#1c1c1e', card: '#2c2c2e',
    border: '#38383a', fg: '#f5f5f7', muted: '#8e8e93', label: '#aeaeb2',
  } : {
    bg: '#f2f2f7', surface: '#fff', card: '#fff',
    border: '#e5e5ea', fg: '#1c1c1e', muted: '#8e8e93', label: '#3c3c43',
  };

  return (
    <div style={{
      width: '100%', height: '100%',
      background: T.bg, color: T.fg,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      <header style={{
        padding: 'max(env(safe-area-inset-top, 0), 14px) 20px 10px',
        display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
          <div style={{
            width: 30, height: 30, borderRadius: 8,
            background: themeAccent, color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
          }}><Icon.Ballot size={16} stroke={2}/></div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 600 }}>iLaw Vote 2569</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: -2 }}>นับคะแนนเลือกตั้ง</div>
          </div>
        </div>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          {!state.submitted && (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 6,
              background: T.surface, padding: '6px 12px',
              borderRadius: 100, fontSize: 12, color: T.label, fontWeight: 500,
            }}>
              ขั้นที่ <span style={{ color: themeAccent, fontWeight: 700 }}>{state.step}</span>/4
            </div>
          )}
          <ThemeToggle theme={theme} setTheme={setTheme} T={T}/>
        </div>
      </header>

      {!state.submitted && (
        <div style={{ padding: '0 20px 16px', display: 'flex', gap: 4 }}>
          {[1,2,3,4].map((i) => (
            <div key={i} style={{
              flex: 1, height: 4, borderRadius: 2,
              background: i <= state.step ? themeAccent : T.border,
              transition: 'background 0.4s',
            }}/>
          ))}
        </div>
      )}

      <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden', padding: '8px 16px 32px' }}>
        <div style={{ maxWidth: 600, margin: '0 auto' }}>
          {state.step === 1 && <CardLocation flow={flow} T={T} accent={accent.zone} dark={dark}/>}
          {state.step === 2 && <CardType flow={flow} T={T} accent={accent}/>}
          {state.step === 3 && <CardScores flow={flow} T={T} accent={themeAccent} dark={dark}/>}
          {state.step === 4 && <CardConfirm flow={flow} T={T} accent={themeAccent} dark={dark}/>}
          {state.submitted && <CardSuccess flow={flow} T={T} accent={themeAccent}/>}
        </div>
      </div>
    </div>
  );
}

function HeroCard({ T, accent, eyebrow, title, sub, children }) {
  return (
    <div style={{
      background: T.surface, borderRadius: 22, padding: '28px 22px',
      marginBottom: 14, animation: 'cardIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2)',
    }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: accent, textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 8 }}>{eyebrow}</div>
      <h2 style={{ fontSize: 28, fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: sub ? 8 : 0 }}>{title}</h2>
      {sub && <p style={{ fontSize: 15, color: T.muted, lineHeight: 1.45 }}>{sub}</p>}
      {children}
    </div>
  );
}

function FormCard({ T, children }) {
  return (
    <div style={{
      background: T.surface, borderRadius: 18, padding: 4, marginBottom: 14,
      animation: 'cardIn 0.4s 0.05s both cubic-bezier(0.2, 0.9, 0.3, 1.2)',
    }}>{children}</div>
  );
}

function GroupedRow({ T, label, children, last }) {
  return (
    <div style={{
      padding: '12px 18px',
      borderBottom: last ? 'none' : `0.5px solid ${T.border}`,
      display: 'flex', flexDirection: 'column', gap: 8,
    }}>
      {label && <div style={{ fontSize: 12, fontWeight: 500, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.5 }}>{label}</div>}
      {children}
    </div>
  );
}

function CardLocation({ flow, T, accent, dark }) {
  const { state, setProvince, setDistrict, setUnitType, setAmphoe, setTambon, setUnit,
    locationValid, districtsForProvince, amphoesObj, tambonsObj, unitsList, goStep } = flow;
  return (
    <div>
      <HeroCard T={T} accent={accent} eyebrow="ขั้นที่ 1 จาก 4" title="เลือกหน่วยเลือกตั้ง"
        sub="เลือกตำแหน่งที่คุณกำลังตรวจคะแนน"/>
      <FormCard T={T}>
        <GroupedRow T={T} label="จังหวัด">
          <Dropdown value={state.province} onChange={setProvince}
            options={SAMPLE_DATA.provinces.map((p) => ({ value: p.name, label: p.name }))}
            placeholder="เลือกจังหวัด" accent={accent} dark={dark}/>
        </GroupedRow>
        <GroupedRow T={T} label="เขตเลือกตั้ง">
          <Dropdown value={state.district} onChange={setDistrict}
            options={districtsForProvince.map((d) => ({ value: String(d), label: `เขต ${d}` }))}
            placeholder="เลือกเขต" disabled={!state.province} accent={accent} dark={dark}/>
        </GroupedRow>
        <GroupedRow T={T} label="ประเภทหน่วย" last>
          <Dropdown value={state.unitType} onChange={setUnitType}
            options={[
              { value: 'normal', label: 'หน่วยปกติ (ในเขต)' },
              { value: 'advance-out', label: 'เลือกตั้งล่วงหน้านอกเขต' },
              { value: 'overseas', label: 'นอกราชอาณาจักร' },
            ]}
            placeholder="เลือกประเภท" disabled={!state.district} accent={accent} dark={dark}/>
        </GroupedRow>
      </FormCard>

      {state.unitType === 'normal' && (
        <FormCard T={T}>
          <GroupedRow T={T} label="อำเภอ/เขต">
            <Dropdown value={state.amphoe} onChange={setAmphoe}
              options={Object.keys(amphoesObj).map((a) => ({ value: a, label: a }))}
              placeholder="เลือกอำเภอ" accent={accent} dark={dark}/>
          </GroupedRow>
          <GroupedRow T={T} label="ตำบล/แขวง">
            <Dropdown value={state.tambon} onChange={setTambon}
              options={Object.keys(tambonsObj).map((t) => ({ value: t, label: t }))}
              placeholder="เลือกตำบล" disabled={!state.amphoe} accent={accent} dark={dark}/>
          </GroupedRow>
          <GroupedRow T={T} label="หน่วยเลือกตั้ง" last>
            <Dropdown value={state.unit}
              onChange={(u) => { const f = unitsList.find((x) => x.unit === u); setUnit(u, f?.place); }}
              options={unitsList.map((u) => ({ value: u.unit, label: `หน่วยที่ ${u.unit}` }))}
              placeholder="เลือกหน่วย" disabled={!state.tambon} accent={accent} dark={dark}/>
            {state.place && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: T.muted, fontSize: 13, marginTop: 4 }}>
                <Icon.Pin size={13}/> {state.place}
              </div>
            )}
          </GroupedRow>
        </FormCard>
      )}

      <PillButton accent={accent} disabled={!locationValid} onClick={() => goStep(2)}>
        ดำเนินการต่อ <Icon.ChevronRight size={16}/>
      </PillButton>
    </div>
  );
}

function CardType({ flow, T, accent }) {
  const { state, setType, goStep } = flow;
  const themeAccent = state.type === 'party' ? accent.party : accent.zone;
  const cards = [
    { id: 'zone', icon: <Icon.Map size={32} stroke={1.4}/>, title: 'แบบแบ่งเขต', sub: 'เลือกตัวบุคคล', color: accent.zone },
    { id: 'party', icon: <Icon.List size={32} stroke={1.4}/>, title: 'บัญชีรายชื่อ', sub: 'เลือกพรรค', color: accent.party },
  ];
  return (
    <div>
      <HeroCard T={T} accent={accent.zone} eyebrow="ขั้นที่ 2 จาก 4" title="ประเภทคะแนน"
        sub="ส.ส. แบบแบ่งเขต หรือบัญชีรายชื่อ"/>
      <ChipsCard flow={flow} T={T}/>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 14 }}>
        {cards.map((c) => {
          const selected = state.type === c.id;
          return (
            <button key={c.id} onClick={() => setType(c.id)} style={{
              background: T.surface,
              border: `1.5px solid ${selected ? c.color : 'transparent'}`,

              cursor: 'pointer', textAlign: 'left',
              fontFamily: 'inherit', color: T.fg,
              transition: 'all 0.2s',
              display: 'grid', gridTemplateColumns: 'auto 1fr auto', gap: 16, alignItems: 'center',
              animation: 'cardIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2)',
            }}>
              <div style={{
                width: 56, height: 56, borderRadius: 16,
                background: `${c.color}15`, color: c.color,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>{c.icon}</div>
              <div>
                <div style={{ fontSize: 18, fontWeight: 600, letterSpacing: '-0.01em' }}>{c.title}</div>
                <div style={{ fontSize: 13, color: T.muted, marginTop: 2 }}>{c.sub}</div>
              </div>
              <div style={{
                width: 26, height: 26, borderRadius: '50%',
                border: `1.5px solid ${selected ? c.color : T.border}`,
                background: selected ? c.color : 'transparent',
                color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center',
                transition: 'all 0.15s',
              }}>
                {selected && <Icon.Check size={14} stroke={3}/>}
              </div>
            </button>
          );
        })}
      </div>
      <ButtonRow>
        <GhostButton T={T} onClick={() => goStep(1)}>ย้อนกลับ</GhostButton>
        <PillButton accent={themeAccent} disabled={!state.type} onClick={() => goStep(3)} style={{ flex: 1 }}>
          ดำเนินการต่อ
        </PillButton>
      </ButtonRow>
    </div>
  );
}

function CardScores({ flow, T, accent, dark }) {
  const { state, candidates, parties, setScore, goStep, districtKey } = flow;
  const list = state.type === 'zone' ? candidates : parties;
  const bs = SAMPLE_DATA.ballotSummary[districtKey];
  return (
    <div>
      <HeroCard T={T} accent={accent} eyebrow="ขั้นที่ 3 จาก 4" title="กรอกคะแนน"
        sub={state.type === 'zone' ? 'คะแนน ส.ส. แบบแบ่งเขต' : `คะแนนบัญชีรายชื่อ · ${parties.length} พรรค`}/>
      <ChipsCard flow={flow} T={T}/>
      {bs && state.unitType === 'normal' && (
        <div style={{
          background: T.surface, borderRadius: 16, padding: '14px 18px',
          marginBottom: 14, fontSize: 13, color: T.label, lineHeight: 1.6,
          borderLeft: `3px solid ${accent}`,
        }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: accent, marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.6 }}>
            ผลทางการ — เขต {state.district}
          </div>
          ผู้มีสิทธิ์ <b>{fmt(bs.eligible)}</b> · มาใช้สิทธิ์ <b>{fmt(bs.voted)}</b><br/>
          บัตรดี <b>{fmt(bs.valid)}</b> · เสีย <b>{fmt(bs.invalid)}</b> · ไม่เลือก <b>{fmt(bs.noVote)}</b>

      <div style={{ background: T.surface, borderRadius: 18, marginBottom: 14, overflow: 'hidden' }}>

          {state.type === 'zone' ? 'ผู้สมัคร' : 'พรรค'}
        </div>
        {list.map((item, i) => {
          const k = state.type === 'zone' ? `score-${item.no}` : `party-${item.no}`;
          return (
            <div key={item.no} style={{
              padding: '12px 18px',
              borderTop: i === 0 ? 'none' : `0.5px solid ${T.border}`,
              display: 'grid', gridTemplateColumns: 'auto 1fr auto', gap: 12, alignItems: 'center',
            }}>
              <div style={{
                width: 30, height: 30, borderRadius: 8,
                background: `${accent}15`, color: accent,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 13, fontWeight: 700,
              }}>{item.no}</div>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 500, color: T.fg, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.name}</div>
                {item.party && <div style={{ fontSize: 12, color: T.muted, marginTop: 1 }}>{item.party}</div>}
              </div>
              <ScoreInput value={state.scores[k]} onChange={(v) => setScore(k, v)} dark={dark} accent={accent}/>

          );
        })}
      </div>
      <div style={{ background: T.surface, borderRadius: 18, marginBottom: 14, overflow: 'hidden' }}>
        <div style={{ padding: '14px 18px 6px', fontSize: 12, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6 }}>
          บัตรพิเศษ

        <SpecialMobileRow T={T} dark={dark} accent={accent} color="#f59e0b"

        <SpecialMobileRow T={T} dark={dark} accent={accent} color="#ef4444" border
          label="บัตรไม่เลือกใคร" value={state.scores['noVote']} onChange={(v) => setScore('noVote', v)}/>
      </div>
      <ButtonRow>
        <GhostButton T={T} onClick={() => goStep(2)}>ย้อนกลับ</GhostButton>
        <PillButton accent={accent} onClick={() => goStep(4)} style={{ flex: 1 }}>
          ตรวจสอบก่อนส่ง
        </PillButton>
      </ButtonRow>
    </div>
  );

function SpecialMobileRow({ T, dark, accent, color, label, value, onChange, border }) {
  return (
    <div style={{
      padding: '12px 18px',
      borderTop: border ? `0.5px solid ${T.border}` : 'none',
      display: 'grid', gridTemplateColumns: 'auto 1fr auto', gap: 12, alignItems: 'center',

      <div style={{ width: 10, height: 10, borderRadius: '50%', background: color }}/>
      <div style={{ fontSize: 14, fontWeight: 500, color: T.fg }}>{label}</div>
      <ScoreInput value={value} onChange={onChange} dark={dark} accent={accent}/>
    </div>

}

    <div>
      <HeroCard T={T} accent={accent} eyebrow="ขั้นที่ 4 จาก 4" title="ยืนยันก่อนส่ง"
        sub="ตรวจสอบความถูกต้อง เมื่อส่งแล้วจะแก้ไขไม่ได้อีก"/>
      <ChipsCard flow={flow} T={T}/>
      <div style={{ background: T.surface, borderRadius: 22, marginBottom: 14, overflow: 'hidden' }}>
        <div style={{ padding: '18px 20px 12px' }}>
          <div style={{ fontSize: 12, color: T.muted, textTransform: 'uppercase', fontWeight: 600, letterSpacing: 0.6 }}>สรุป</div>
          <div style={{ fontSize: 14, color: T.fg, marginTop: 4 }}>
            {state.type === 'zone' ? 'ส.ส. แบบแบ่งเขต' : 'บัญชีรายชื่อ'} · {totals.rows.length} รายการ
          </div>
        </div>
        <div style={{ maxHeight: 240, overflowY: 'auto', padding: '0 20px' }}>

            <div key={r.key} style={{
              padding: '8px 0', display: 'flex', justifyContent: 'space-between', gap: 12,
              fontSize: 14, borderTop: `0.5px solid ${T.border}`,
            }}>
              <span style={{ color: T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.no}. {r.name}</span>
              <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(r.value)}</span>
            </div>
          ))}
          <div style={{ padding: '8px 0', display: 'flex', justifyContent: 'space-between', fontSize: 14, borderTop: `0.5px solid ${T.border}` }}>
            <span style={{ color: '#f59e0b' }}>บัตรเสีย</span>
            <span style={{ color: T.fg, fontWeight: 600 }}>{fmt(totals.invalid)}</span>
          </div>
          <div style={{ padding: '8px 0', display: 'flex', justifyContent: 'space-between', fontSize: 14, borderTop: `0.5px solid ${T.border}` }}>
            <span style={{ color: '#ef4444' }}>บัตรไม่เลือกใคร</span>
            <span style={{ color: T.fg, fontWeight: 600 }}>{fmt(totals.noVote)}</span>
          </div>
        </div>
        <div style={{
          marginTop: 12, padding: '18px 20px', background: `${accent}10`,
          display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
        }}>
          <span style={{ fontSize: 14, color: T.fg, fontWeight: 600 }}>รวมทั้งหมด</span>
          <span style={{ fontSize: 28, color: accent, fontWeight: 700, letterSpacing: '-0.02em', fontVariantNumeric: 'tabular-nums' }}>
            {fmt(totals.grand)}
          </span>
        </div>
      </div>
      <ButtonRow>
        <GhostButton T={T} onClick={() => goStep(3)}>กลับแก้ไข</GhostButton>
        <PillButton accent={accent} onClick={submit} disabled={state.submitting} style={{ flex: 1 }}>
          {state.submitting ? <><Icon.Spinner size={15}/> &nbsp;กำลังส่ง…</> : <><Icon.Send size={15}/> &nbsp;ส่งคะแนน</>}
        </PillButton>
      </ButtonRow>
    </div>

}

function CardSuccess({ flow, T, accent }) {
  const { reset, state } = flow;
  return (
    <div style={{
      background: T.surface, borderRadius: 22, padding: '40px 24px',
      textAlign: 'center', marginTop: 20,
      animation: 'cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2)',
    }}>
      <div style={{
        width: 76, height: 76, borderRadius: '50%',
        background: `${accent}15`, color: accent,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        margin: '0 auto 20px',
        animation: 'checkPop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4) 0.1s both',
      }}>
        <Icon.Check size={38} stroke={2.5}/>
      </div>
      <h2 style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.02em', marginBottom: 8 }}>ส่งคะแนนสำเร็จ</h2>
      <p style={{ fontSize: 15, color: T.muted, marginBottom: 16 }}>ข้อมูลถูกบันทึกเรียบร้อยแล้ว</p>
      <div style={{
        display: 'inline-block', padding: '6px 14px', borderRadius: 8,

      <div style={{ marginTop: 28 }}>
        <PillButton accent={accent} onClick={reset}>
          <Icon.Plus size={16}/> &nbsp;บันทึกหน่วยถัดไป
        </PillButton>
      </div>

  );

function PillButton({ children, accent, disabled, onClick, style }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      width: '100%', padding: '15px 20px',
      background: disabled ? '#c7c7cc' : accent, color: '#fff',
      border: 'none', borderRadius: 16,
      fontSize: 16, fontWeight: 600, fontFamily: 'inherit',
      cursor: disabled ? 'not-allowed' : 'pointer',
      transition: 'transform 0.1s',
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 4,
      opacity: disabled ? 0.5 : 1,
      ...style,
    }} onMouseDown={(e) => { if (!disabled) e.currentTarget.style.transform = 'scale(0.98)'; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = 'none'; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = 'none'; }}>
      {children}
    </button>
  );
}

// ============================================================
// DESKTOP / TABLET — Landscape, no sidebar, no edit-after-submit
// Self-adapts to split-screen via ResizeObserver
// ============================================================
function VariantDesktop({ theme, setTheme, accent }) {
  const flow = useElectionFlow();
  const { state } = flow;
  const dark = theme === 'dark';
  const themeAccent = state.type === 'party' ? accent.party : accent.zone;

  const containerRef = React.useRef(null);
  const [narrow, setNarrow] = React.useState(false);
  React.useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver((entries) => {
      for (const e of entries) setNarrow(e.contentRect.width < 820);
    });
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  const T = dark ? {
    bg: '#0a0a0a', surface: '#16161a', card: '#1c1c20',
    border: '#27272a', borderStrong: '#3f3f46',
    fg: '#fafafa', muted: '#a1a1aa', subtle: '#71717a', inputBg: '#1c1c20',
  } : {
    bg: '#f5f5f7', surface: '#fff', card: '#fff',
    border: '#e4e4e7', borderStrong: '#d4d4d8',
    fg: '#18181b', muted: '#52525b', subtle: '#a1a1aa', inputBg: '#fff',
  };

  if (state.submitted) {
    return <div ref={containerRef} style={{ width: '100%', height: '100%' }}>
      <DSuccess flow={flow} T={T} accent={themeAccent} narrow={narrow}/>
    </div>;
  }

  return (
    <div ref={containerRef} style={{
      width: '100%', height: '100%',
      background: T.bg, color: T.fg,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      <DTopbar T={T} accent={themeAccent} flow={flow} narrow={narrow} theme={theme} setTheme={setTheme}/>
      <div style={{ flex: 1, minHeight: 0, overflow: 'hidden' }}>
        {state.step === 1 && <DLocation flow={flow} T={T} accent={accent} narrow={narrow} dark={dark}/>}
        {state.step === 2 && <DType flow={flow} T={T} accent={accent} narrow={narrow}/>}
        {state.step === 3 && <DScores flow={flow} T={T} accent={themeAccent} dark={dark} narrow={narrow}/>}
        {state.step === 4 && <DConfirm flow={flow} T={T} accent={themeAccent} narrow={narrow}/>}
      </div>
    </div>
  );
}

                    padding: '10px 18px',
                    display: 'flex', justifyContent: 'space-between', gap: 12,
                    fontSize: 13, borderBottom: `1px solid ${T.border}`,
                  }}>
                    <span style={{ color: T.muted, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                      <span style={{ color: accent, fontWeight: 600 }}>{r.no}.</span> {r.name}
                    </span>
                    <span style={{ color: T.fg, fontWeight: 500, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmt(r.value)}</span>
                  </div>
                ))}
              </div>
              <div style={{ padding: '11px 18px', display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: `1px solid ${T.border}`, background: T.bg }}>
                <span style={{ color: '#f59e0b', fontWeight: 500 }}>บัตรเสีย</span>
                <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.invalid)}</span>
              </div>
              <div style={{ padding: '11px 18px', display: 'flex', justifyContent: 'space-between', fontSize: 13, background: T.bg }}>
                <span style={{ color: '#ef4444', fontWeight: 500 }}>บัตรไม่เลือกใคร</span>
                <span style={{ color: T.fg, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.noVote)}</span>
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 10 }}>หน่วย</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, fontSize: 13 }}>
                  <DSumRow label="จังหวัด" value={state.province} T={T}/>
                  <DSumRow label="เขต" value={`เขต ${state.district}`} T={T}/>
                  {state.unit && <DSumRow label="หน่วย" value={state.unit} T={T}/>}
                  {state.place && <DSumRow label="สถานที่" value={state.place} T={T}/>}
                  <DSumRow label="ประเภท" value={state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ'} T={T} accent={accent}/>
                </div>
              </div>
              <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: 20 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 8 }}>รวมคะแนน</div>
                <div style={{ fontSize: 40, fontWeight: 600, color: accent, letterSpacing: '-0.03em', lineHeight: 1, fontVariantNumeric: 'tabular-nums' }}>
                  {fmt(totals.grand)}
                </div>
                <div style={{ marginTop: 4, fontSize: 12, color: T.muted }}>คะแนนรวมทั้งหมด</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <DFooter T={T}>
        <DGhost T={T} onClick={() => flow.goStep(3)}><Icon.ChevronLeft size={14}/> กลับไปแก้ไข</DGhost>
        <DPrimary accent={accent} onClick={() => submit()} disabled={state.submitting}>
          {state.submitting ? <><Icon.Spinner size={14}/> กำลังส่ง…</> : <><Icon.Send size={14}/> ส่งคะแนนเข้าระบบ</>}
        </DPrimary>
      </DFooter>
    </div>
  );
}

function DSuccess({ flow, T, accent, narrow }) {
  const { reset, state } = flow;
  const totals = computeTotals(flow);
  return (
    <div style={{
      width: '100%', height: '100%',
      background: T.bg, color: T.fg,
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden', position: 'relative',
    }}>
      <div style={{
        position: 'absolute', inset: 0,
        background: `radial-gradient(ellipse at 50% 30%, ${accent}10, transparent 60%)`,
        pointerEvents: 'none',
      }}/>
      <div style={{
        flex: 1, minHeight: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: narrow ? 20 : 40, position: 'relative', zIndex: 1, overflowY: 'auto',
      }}>
        <div style={{
          background: T.surface, border: `1px solid ${T.border}`,
          borderRadius: 20, padding: narrow ? '36px 24px' : '48px 40px',
          maxWidth: 560, width: '100%', textAlign: 'center',
          boxShadow: T.bg === '#0a0a0a' ? '0 30px 80px rgba(0,0,0,0.4)' : '0 30px 80px rgba(0,0,0,0.08)',
          animation: 'cardIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2)',
        }}>
          <div style={{
            width: 84, height: 84, borderRadius: '50%',
            background: `${accent}15`, color: accent,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            margin: '0 auto 24px',
            animation: 'checkPop 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4) 0.1s both',
          }}><Icon.Check size={44} stroke={2.5}/></div>
          <h1 style={{ fontSize: narrow ? 26 : 32, fontWeight: 600, letterSpacing: '-0.02em', marginBottom: 10 }}>ส่งคะแนนสำเร็จ</h1>
          <p style={{ fontSize: 15, color: T.muted, marginBottom: 28, lineHeight: 1.5 }}>
            บันทึกข้อมูลเรียบร้อยแล้ว
          </p>
          <div style={{
            background: T.bg, border: `1px solid ${T.border}`,
            borderRadius: 14, padding: '18px 20px', marginBottom: 24,
            display: 'grid', gridTemplateColumns: narrow ? '1fr' : '1fr 1fr', gap: 14, textAlign: 'left',
          }}>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>หน่วย</div>
              <div style={{ fontSize: 13, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                {state.province} · เขต {state.district}{state.unit ? ` · หน่วย ${state.unit}` : ''}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>ประเภท</div>
              <div style={{ fontSize: 13, fontWeight: 500, color: accent }}>
                {state.type === 'zone' ? 'แบ่งเขต' : 'บัญชีรายชื่อ'}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>คะแนนรวม</div>
              <div style={{ fontSize: 13, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{fmt(totals.grand)}</div>
            </div>
            <div>
              <div style={{ fontSize: 10, color: T.muted, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 4 }}>เวลา</div>
              <div style={{ fontSize: 13, fontWeight: 500 }}>
                {new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}
              </div>
            </div>
          </div>
          <div style={{
            display: 'inline-block', padding: '8px 16px', borderRadius: 10,
            background: T.bg, color: accent, fontFamily: 'ui-monospace, monospace', fontSize: 13,
            border: `1px solid ${T.border}`, marginBottom: 28,
          }}>ID · {state.submissionId}</div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center' }}>
            <DPrimary accent={accent} onClick={reset}>
              <Icon.Plus size={14}/> บันทึกหน่วยถัดไป
            </DPrimary>
          </div>
        </div>
      </div>
    </div>
  );
}

function DField({ label, children, T }) {
  return (
    <div>
      <label style={{ display: 'block', fontSize: 11, fontWeight: 600, color: T.muted, marginBottom: 6, textTransform: 'uppercase', letterSpacing: 0.5 }}>{label}</label>
      {children}
    </div>
  );
}

function DSumRow({ label, value, T, accent }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 8 }}>
      <span style={{ color: T.muted }}>{label}</span>
      <span style={{ color: accent || T.fg, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{value}</span>
    </div>
  );
}

function DFooter({ children, T }) {
  return (
    <div style={{
      flexShrink: 0, padding: '14px 32px',
      borderTop: `1px solid ${T.border}`, background: T.surface,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
    }}>{children}</div>
  );
}

function DPrimary({ children, accent, disabled, onClick }) {
  return (
    <button onClick={onClick} disabled={disabled} style={{
      padding: '11px 22px', background: disabled ? '#d4d4d8' : accent, color: '#fff',
      border: 'none', borderRadius: 10,
      fontSize: 14, fontWeight: 600, fontFamily: 'inherit',
      cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.5 : 1,
      display: 'inline-flex', alignItems: 'center', gap: 6,
    }}>{children}</button>
  );
}

function DGhost({ children, T, onClick }) {
  return (
    <button onClick={onClick} style={{
      padding: '11px 18px', background: 'transparent', color: T.fg,
      border: `1px solid ${T.border}`, borderRadius: 10,
      fontSize: 14, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer',
      display: 'inline-flex', alignItems: 'center', gap: 6,
    }}>{children}</button>
  );
}

function ThemeToggle({ theme, setTheme, T }) {
  const dark = theme === 'dark';
  const bg = T?.surface || (dark ? '#1c1c20' : '#fff');
  const fg = T?.fg || (dark ? '#fafafa' : '#18181b');
  const bd = T?.border || (dark ? '#27272a' : '#e4e4e7');
  return (
    <button
      onClick={() => setTheme((t) => (t === 'dark' ? 'light' : 'dark'))}
      title={dark ? 'สลับโหมดสว่าง' : 'สลับโหมดมืด'}
      style={{
        width: 34, height: 34, borderRadius: '50%',
        background: bg, color: fg, border: `1px solid ${bd}`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        cursor: 'pointer', fontFamily: 'inherit', flexShrink: 0,
        transition: 'transform 0.15s, background 0.2s',
        padding: 0,
      }}
      onMouseDown={(e) => { e.currentTarget.style.transform = 'scale(0.92)'; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = 'none'; }}
      onMouseLeave={(e) => { e.currentTarget.style.transform = 'none'; }}>
      {dark ? <Icon.Sun size={15}/> : <Icon.Moon size={15}/>}
    </button>
  );
}

// ============================================================
// APP — viewport-aware variant switch + theme toggle
// ============================================================
const ACCENT = { zone: '#34a853', party: '#d6336c' };

function App() {
  const [theme, setTheme] = React.useState(() => {
    if (typeof window === 'undefined') return 'light';
    const saved = localStorage.getItem('ilaw-vote-theme');
    if (saved) return saved;
    return window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  React.useEffect(() => { localStorage.setItem('ilaw-vote-theme', theme); }, [theme]);

  const [isMobile, setIsMobile] = React.useState(() => window.innerWidth < 600);
  React.useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth < 600);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      {isMobile
        ? <VariantCards theme={theme} setTheme={setTheme} accent={ACCENT}/>
        : <VariantDesktop theme={theme} setTheme={setTheme} accent={ACCENT}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
